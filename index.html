<style>

  body {

  @keyframes pulseBig { 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

  .speaker { color:#e8d5a8; }

  .speaker.clickable:hover { color:#f0e0b8; border-bottom-color:#e8d5a8; }
  .narration { color:#a89880; font-style:italic; }
  .thought { color:#c9a87a; }

  #choices { display:none; flex-direction:column; gap:14px; }

    background:transparent; border:1px solid #4a3f32;

  #betPanel .bet-title { color:#e8d5a8; margin-bottom:14px; font-size:16px; }
  #betPanel .bet-good { color:#7a9e7a; margin-bottom:8px; line-height:1.6; }
  #betPanel .bet-bad { color:#b85c4a; margin-bottom:16px; line-height:1.6; }
  #betPanel .bet-actions { display:flex; gap:12px; }
  .bet-action-btn {
    background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:10px 24px;

  .bet-action-btn.primary:hover { background:#b85c4a; color:#1a1714; }
  .bet-action-btn.locked { opacity:0.5; }

  .shake { animation: shake 0.4s ease; }

  #warningMsg { display:none; color:#e04838; font-size:18px; margin-top:14px; letter-spacing:2px; font-weight:bold; text-shadow: 0 0 12px rgba(224,72,56,0.6); }

  #notebookBtn { bottom:20px; }
  #statsBtn { bottom:70px; }

  #guideBtn {

    left: 30px; bottom: 130px;
    background: rgba(60, 50, 40, 0.8); 
    border: 1px solid #8a7d6b;
    color: #e8d5a8; padding: 8px 16px;

    letter-spacing: 2px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  #guideBtn:hover { background: #4a3f32; }

  #notebook {
    display:none; position:fixed; right:20px; bottom:70px;
    width:320px; max-height:450px; overflow-y:auto;
    background:#1f1a14; border:1px solid #4a3f32;
    padding:18px; z-index:60; font-size:14px; line-height:1.8;
  }
  #notebook h3 { color:#e8d5a8; font-size:16px; margin-bottom:8px; }
  #notebook h4 { color:#c9a87a; font-size:14px; margin:12px 0 6px; letter-spacing:2px; }

  .float-text {

    background:transparent; color:#8a7d6b; font-family:inherit; font-size:12px;

  }
  .record-btn:hover { border-color:#8a7d6b; color:#d4c9b8; }
  .record-btn.done { opacity:0.4; pointer-events:none; }

  #scrollHint { text-align:center; color:#5a4f42; font-size:15px; margin-top:40px; padding-bottom:50px; display:none; letter-spacing:4px; }

  #audioStatus {
    position:fixed; left:50%; top:16px; transform:translateX(-50%);
    font-size:13px; color:#8a7d6b; z-index:90; background:rgba(26,23,20,0.9); padding:6px 14px;
    border:1px solid #4a3f32; display:none;
  }

  /* 面板基础 */
  #npcOverlay, #statsOverlay, #endingOverlay {
    position:fixed; inset:0; z-index:150; background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; backdrop-filter: blur(2px);
  }
  #npcPanel, #statsPanel, #endingPanel {
    background:#1f1a14; border:1px solid #6a5a42; padding:28px 32px;
    max-width:460px; width:90%; line-height:1.8; box-shadow: 0 0 40px rgba(0,0,0,0.6); position:relative;
  }
  #npcPanel h3 { color:#e8d5a8; font-size:24px; margin-bottom:6px; letter-spacing:4px; font-weight:normal; }
  #npcPanel .npc-title { color:#8a7d6b; font-size:13px; margin-bottom:16px; letter-spacing:2px; }
  #npcPanel .npc-desc { color:#a89880; font-size:15px; margin-bottom:22px; font-style:italic; line-height:1.9; padding-bottom:18px; border-bottom:1px dotted #332b22; }
  #npcPanel .stat-row { display:flex; align-items:center; margin-bottom:10px; }
  #npcPanel .stat-name { width:60px; color:#8a7d6b; font-size:14px; letter-spacing:1px; }
  #npcPanel .stat-bar { flex:1; height:8px; background:#2a2218; margin:0 12px; overflow:hidden; }
  #npcPanel .stat-fill { height:100%; transition:width 0.3s ease; }
  #npcPanel .stat-val { width:30px; font-size:14px; text-align:right; font-weight:bold; }
  .close-btn {
    position:absolute; top:14px; right:18px; background:transparent; border:none;
    color:#8a7d6b; font-size:22px; cursor:pointer; font-family:inherit; padding:0 6px;
  }
  .close-btn:hover { color:#e8d5a8; }
  #npcPanel .hint { color:#5a4f42; font-size:12px; margin-top:18px; text-align:center; letter-spacing:2px; }

  #statsPanel { text-align:center; padding:36px 32px 30px; }
  #statsPanel h3 { color:#e8d5a8; font-size:22px; margin-bottom:6px; letter-spacing:6px; font-weight:normal; }
  #statsPanel .stats-title-sub { color:#6a5a42; font-size:12px; margin-bottom:26px; letter-spacing:3px; }
  #statsPanel .stats-desc { color:#d4c9b8; font-size:18px; line-height:2; padding:22px 4px; border-top:1px dotted #332b22; border-bottom:1px dotted #332b22; margin-bottom:20px; }
  #statsPanel .stats-foot { color:#5a4f42; font-size:12px; letter-spacing:2px; font-style:italic; }

  #endingPanel .ending-sub { color:#6a5a42; font-size:13px; margin-bottom:28px; letter-spacing:4px; }

  .restart-btn:hover { background:#8a7d6b; color:#1a1714; }

</style>
</head>

<div id="redVignette"></div>
<div id="audioStatus"></div>

<div id="startScreen">
  <h1>青石城</h1>
  <p>你守的不是一座城，是一万个家。</p>
  <button class="mode-btn" id="startNormalBtn">普通模式<span class="sub">只凭直觉，向死而生</span></button>
  <button class="mode-btn" id="startGuideBtn">引导模式<span class="sub">左侧提供兵法提示</span></button>
</div>

<div id="gameScreen">

  <div id="betPanel"></div>
  <div id="result"></div>
</div>

<img id="heart" class="calm" src="https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png" alt="">

<div id="guideOverlay">
  <h3 id="guideTitle">兵法</h3>
  <div id="guideContent"></div>
</div>

<button id="guideBtn">兵法</button>
<button id="statsBtn">我的属性</button>
<button id="notebookBtn">军帐笔记</button>

<div id="notebook">
  <h3>军帐笔记</h3>

  <p class="notebook-empty" id="notebookEmpty">尚无记录。</p>

</div>

<div id="tutorialTip">点击【记下】把数字记入笔记。<br>不记也不会死，但记混了别怪军师。</div>

<div id="npcOverlay">
  <div id="npcPanel">
    <button class="close-btn" id="npcClose">×</button>

    <div class="npc-desc" id="npcDesc"></div>
    <div id="npcStats"></div>
    <div class="hint">点击名字可随时查看</div>
  </div>
</div>

  <div id="statsPanel">

    <div class="ending-stats" id="endingStats"></div>
    <div class="end-btns">

      <button class="restart-btn" onclick="location.reload()">再守一次</button>
    </div>
  </div>
</div>

function showAudioStatus(msg) {

  setTimeout(() => { audioStatus.style.display = 'none'; }, 5000);
}

function startBgm() {
  bgm.volume = 0.4;
  const p = bgm.play();
  if (p && p.catch) p.catch(err => showAudioStatus('背景音乐未能播放：' + err.name));
}

function checkTicks() {
  if (!state.started) { requestAnimationFrame(checkTicks); return; }
  if (!bgm.paused) {
    const t = bgm.currentTime;
    if (t < lastBgmTime - 1) markIndex = 0;
    lastBgmTime = t;
    while (markIndex < tickMarks.length && tickMarks[markIndex] <= t) {
      if (!state.heartExcited) pulseHeart();
      markIndex++;
    }
  }
  requestAnimationFrame(checkTicks);
}

function pulseHeart() {
  const anim = state.heartExcited ? 'pulseBig' : 'pulseSmall';
  heart.style.animation = 'none';
  void heart.offsetHeight;
  heart.style.animation = anim + ' 0.2s ease-out';
}

function playHeartbeatSfx() {
  try {
    heartbeatSfx.currentTime = 0;
    heartbeatSfx.volume = 0.6;
    heartbeatSfx.play().catch(() => {});
  } catch (e) {}
}

function setHeartExcited(excited) {
  state.heartExcited = excited;

const STAT_NAMES = ['智谋','胆识','统率','威望','果断'];
const STRONG_PHRASES = { 智谋:'军中都说你心思缜密', 胆识:'军中都说你敢下狠手', 统率:'你带兵有方', 威望:'军民都服你', 果断:'你做事从不拖泥带水' };
const WEAK_PHRASES = { 智谋:'但有时想得不深', 胆识:'但遇大事有时迟疑', 统率:'但不太体恤士卒死活', 威望:'但底下人心里不太服', 果断:'但遇事容易犹豫' };

function describePlayer(stats) {
  const vals = STAT_NAMES.map(n => stats[n]);
  const minV = Math.min(...vals);
  const maxV = Math.max(...vals);
  if ((maxV - minV <= 1) && maxV <= 6 && minV >= 4) return '一个平平无奇的守将，没有特别出彩的地方，也没有明显短板。';
  const maxName = STAT_NAMES[vals.indexOf(maxV)];
  const minName = STAT_NAMES[vals.indexOf(minV)];
  if (maxV >= 6 && minV <= 4 && maxName !== minName) return STRONG_PHRASES[maxName] + '，' + WEAK_PHRASES[minName] + '。';
  if (maxV >= 6) return STRONG_PHRASES[maxName] + '。';
  if (minV <= 4) return '说不上哪里好，' + WEAK_PHRASES[minName] + '。';
  return '一个平平无奇的守将。';
}

function applyStatChanges(changes) {
  if (!changes) return;
  Object.entries(changes).forEach(([stat, delta]) => {
    if (state.playerStats[stat] !== undefined) {
      state.playerStats[stat] = Math.max(1, Math.min(10, state.playerStats[stat] + delta));
    }
  });
}

function calcWinChance(choice) {
  let chance = choice.winChance !== undefined ? choice.winChance : 0.6;
  if (choice.statBonus) {
    Object.entries(choice.statBonus).forEach(([stat, bonus]) => {
      const diff = (state.playerStats[stat] || 5) - 5;
      chance += diff * bonus;
    });
  }
  if (choice.floatBonus && state.floatedTexts.includes(choice.floatBonus.index)) {
    chance += choice.floatBonus.bonus;
  }
  return Math.max(0.05, Math.min(0.95, chance));
}

function spawnFloatTexts() {
  const available = floatTextPool
    .map((item, i) => ({ item, i }))
    .filter(x => !state.floatedTexts.includes(x.i));
  if (available.length === 0) return;
  const pick = available[Math.floor(Math.random() * available.length)];
  state.floatedTexts.push(pick.i);
  const data = pick.item;

  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.left = (Math.random() * 55 + 10) + '%';
  el.style.top = (Math.random() * 45 + 20) + '%';
  el.innerHTML = data.frag +
    '<div class="full">' + data.full +
      '<button class="record-close-btn">记录并关闭</button>' +
    '</div>';

  el.onclick = (e) => {
    if (e.target.classList.contains('record-close-btn')) {
      addRumor(data.full);
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
      return;
    }
    el.classList.toggle('expanded');
  };
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
}

function revealOnBottom(callback) {
  if (activeRevealHandler) {
    window.removeEventListener('scroll', activeRevealHandler);
    activeRevealHandler = null;
  }
  const reveal = () => {
    if (activeRevealHandler) {
      window.removeEventListener('scroll', activeRevealHandler);
      activeRevealHandler = null;
    }
    scrollHint.style.display = 'none';
    callback();
  };
  const atBottom = () => window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 100;
  activeRevealHandler = () => { if (atBottom()) reveal(); };
  setTimeout(() => {
    if (document.documentElement.scrollHeight <= window.innerHeight + 50) { reveal(); return; }
    if (atBottom()) { reveal(); return; }
    scrollHint.style.display = 'block';
    window.addEventListener('scroll', activeRevealHandler);
  }, 200);
}

function showTutorialTip() {
  if (tutorialShown) return;
  tutorialShown = true;
  tutorialTip.style.display = 'block';
  setTimeout(() => { tutorialTip.style.display = 'none'; }, 9000);
}

function onChoiceClick(choice) {
  if (state.forcedBet) return;
  choicesEl.style.display = 'none';
  betPanelEl.style.display = 'block';
  const locked = state.rethought;
  betPanelEl.innerHTML =
    '<div class="bet-title">你确定吗？</div>' +
    `<div class="bet-good">如果赌对：${choice.betGood}</div>` +
    `<div class="bet-bad">如果赌错：${choice.betBad}</div>` +
    '<div class="bet-actions">' +
      '<button class="bet-action-btn primary" id="betConfirm">下注</button>' +
      `<button class="bet-action-btn${locked?' locked':''}" id="betThink">再想想</button>` +
    '</div>' +
    '<div id="warningMsg">主帅，请做出决定！！！</div>';
  document.getElementById('betConfirm').onclick = () => confirmBet(choice);
  document.getElementById('betThink').onclick = () => {
    if (state.rethought) {
      const warn = document.getElementById('warningMsg');
      warn.style.display = 'block';
      betPanelEl.classList.remove('shake');
      void betPanelEl.offsetHeight;
      betPanelEl.classList.add('shake');
      warn.style.opacity = '0';
      setTimeout(() => { warn.style.transition = 'opacity 0.2s'; warn.style.opacity = '1'; }, 10);
    } else {
      state.rethought = true;
      setHeartExcited(true);
      betPanelEl.style.display = 'none';
      choicesEl.style.display = 'flex';
    }
  };
}

function confirmBet(choice) {
  state.forcedBet = true;
  betPanelEl.style.display = 'none';
  betPanelEl.classList.remove('shake');
  setHeartExcited(false);
  applyStatChanges(choice.statChanges);
  const chance = calcWinChance(choice);
  const win = Math.random() < chance;
  showResult(choice, win);
}

function showResult(choice, win) {
  resultEl.style.display = 'block';
  resultEl.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'narration';
  if (win) {
    p.textContent = choice.resultGood;
    applyEffects(choice.effectsGood);
  } else {
    p.textContent = choice.resultBad;
    applyEffects(choice.effectsBad);
    worsenCivilMorale();
  }
  resultEl.appendChild(p);

  // 记录历史
  state.history.push({
    round: state.currentRound,
    choice: choice.text,
    win: win,
    troops: state.troops,
    food: state.food,
    morale: state.morale,
    civilMorale: state.civilMorale
  });

  if (choice.death && !win) {
    const p2 = document.createElement('p');
    p2.className = 'thought';
    p2.textContent = '你没有守住青石城。';
    resultEl.appendChild(p2);
    setTimeout(() => showEnding('城破被俘'), 1200);
    return;
  }

  if (state.morale >= 1 || state.civilMorale >= 1) spawnFloatTexts();

  revealOnBottom(() => {
    const contBtn = document.createElement('button');
    contBtn.className = 'bet-action-btn primary';
    contBtn.style.marginTop = '20px';
    if (state.currentRound === 5) {
      contBtn.textContent = '看结局';
      contBtn.onclick = () => { showEnding(); };
    } else {
      contBtn.textContent = '继续';
      contBtn.onclick = () => {
        resultEl.innerHTML = '';
        resultEl.style.display = 'none';
        playRound(state.currentRound + 1);
      };
    }
    resultEl.appendChild(contBtn);
  });
}

function applyEffects(effects) {
  if (!effects) return;
  if (effects.troops) state.troops += effects.troops;
  if (effects.food) state.food += effects.food;
  if (effects.morale) state.morale = Math.min(3, state.morale + effects.morale);
  if (effects.water !== undefined) state.water = effects.water;
  if (effects.gateSouth) state.gateSouth = effects.gateSouth;
  if (effects.gateNorth) state.gateNorth = effects.gateNorth;
  if (effects.gateEast) state.gateEast = effects.gateEast;
  updateRedVignette();
  renderNotebook();
}

function playRound(roundNum) {
  state.currentRound = roundNum;
  state.forcedBet = false;
  state.rethought = false;
  
  if (state.isGuided) {
    guideOpen = false;
    guideOverlay.style.display = 'none';
  }

  if (roundNum === 1) {
    renderDialogue(gameContent.round1.intro);
    const infoP = document.createElement('p');
    infoP.className = 'thought';
    infoP.innerHTML = 'B军一万六，你一万二。B军粮草只够半个月，你够四十天。';
    const btn1 = document.createElement('button');
    btn1.className = 'record-btn'; btn1.textContent = '记下兵力';
    btn1.onclick = () => { addNoteKey('我军兵力'); addNoteKey('B军兵力'); btn1.textContent='已记'; btn1.classList.add('done'); };
    const btn2 = document.createElement('button');
    btn2.className = 'record-btn'; btn2.textContent = '记下粮草';
    btn2.onclick = () => { addNoteKey('我军粮草'); addNoteKey('B军粮草'); addNoteKey('城中民心'); addNoteKey('我军军心'); btn2.textContent='已记'; btn2.classList.add('done'); };
    infoP.appendChild(btn1); infoP.appendChild(btn2);
    dialogueEl.appendChild(infoP);
    revealOnBottom(() => { showChoices(gameContent.round1.choices); showTutorialTip(); });
  } else if (roundNum === 2) {
    renderDialogue(gameContent.round2.intro);
    revealOnBottom(() => showChoices(gameContent.round2.choices));
  } else if (roundNum === 3) {
    renderDialogue(gameContent.round3.getIntro());
    revealOnBottom(() => showChoices(gameContent.round3.choices));
  } else if (roundNum === 4) {
    renderDialogue(gameContent.round4.getIntro());
    revealOnBottom(() => showChoices(gameContent.round4.choices));
  } else if (roundNum === 5) {
    renderDialogue(gameContent.round5.getIntro());
    revealOnBottom(() => showChoices(gameContent.round5.choices));
  }
}

function showEnding(forcedEnding) {
  let ending;
  if (forcedEnding === '城破被俘') {
    ending = forcedEnding;
  } else if (state.troops <= 3000 || state.morale >= 3) {
    ending = '城破被俘';
  } else if (state.troops < 6000 || state.morale >= 2) {
    ending = '惨胜';
  } else if (state.troops < 9000) {
    ending = '守住';
  } else {
    ending = '大胜';
  }
  state.finalEnding = ending;

  const titles = { '城破被俘':'城 破', '惨胜':'惨 胜', '守住':'守 住', '大胜':'大 胜' };
  const subs = { '城破被俘':'青石城破，你被俘', '惨胜':'城守住了，但代价太大', '守住':'城还在，人还在', '大胜':'B军溃退，你赢了' };
  const texts = {
    '城破被俘': 'B军从缺口涌进来。你带着最后的亲兵退到内城，刀砍卷了，人也站不住了。周先生挡在你前面，被一枪穿胸。他倒下前最后一句是："主将，老臣……赌错了。" 城破的时候，天还没亮。',
    '惨胜': 'B军退走了。你站在城头，脚下全是尸体，分不清是A军还是B军。老陈在清点人数，周先生不说话，赵将军蹲在墙角。城守住了，但你不知道自己还剩多少能打的兵。风一吹，城头的旗子只剩下半面。',
    '守住': 'B军粮尽退走。你站在城头，看着B军的营火一盏一盏灭了。周先生走过来，说："主将，城还在。" 你点头。赵将军在城下喊："我们赢了！" 你看着他，没说话。赢了，但你知道，这只是这一场。',
    '大胜': 'B军溃退。韩主将带着残部过河，河对岸的弓手射住了你的追兵。他跑了，但带不走那一万多人。你站在城头，看着B军旗子倒下的地方。周先生走过来，只说了一句："主将，天亮了。" 你看着天边，不知道该不该高兴。'
  };

  document.getElementById('endingTitle').textContent = titles[ending];
  document.getElementById('endingSub').textContent = subs[ending];
  document.getElementById('endingText').textContent = texts[ending];
  document.getElementById('endingStats').innerHTML =
    `剩余兵力：<span>${Math.max(0, state.troops)}</span>　` +
    `剩余粮草：<span>${Math.max(0, state.food)}日</span><br>` +
    `军心：<span>${['稳','微乱','不稳','崩'][state.morale] || '稳'}</span>　` +
    `民心：<span>${['稳','微乱','不稳','崩'][state.civilMorale] || '稳'}</span><br>` +
    `水源：<span>${state.water?'正常':'被断'}</span><br>` +
    `在军民眼中：<span>${describePlayer(state.playerStats)}</span>`;

  document.getElementById('endingOverlay').style.display = 'flex';
}

function startGame(isGuided) {
  state.isGuided = isGuided;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  state.started = true;
  
  if (isGuided) {
    guideBtn.style.display = 'block';
  }
  
  startBgm();
  requestAnimationFrame(checkTicks);
  playRound(1);
}

document.getElementById('startNormalBtn').onclick = () => startGame(false);
document.getElementById('startGuideBtn').onclick = () => startGame(true);

// ========== PDF 战报功能 ==========
document.getElementById('downloadPdfBtn').onclick = () => {
  const btn = document.getElementById('downloadPdfBtn');
  const oldText = btn.textContent;
  btn.textContent = '正在生成战报...';
  btn.disabled = true;

  // 1. 填充战报数据
  document.getElementById('pdfEval').textContent = describePlayer(state.playerStats);
  document.getElementById('pdfEnding').textContent = state.finalEnding;
  
  const logHtml = state.history.map(h => {
    const resultStr = h.win ? '【胜】' : '【败】';
    return `<li>
      <b>第${h.round}轮：</b>${h.choice}<br>
      <span style="color:${h.win ? '#2e7d32' : '#c62828'}">${resultStr}</span>
      （战后余兵：${Math.max(0, h.troops)}人 | 粮草：${Math.max(0, h.food)}日 | 军心：${['稳','微乱','不稳','崩'][h.morale]} | 民心：${['稳','微乱','不稳','崩'][h.civilMorale]}）
    </li>`;
  }).join('');
  document.getElementById('pdfLog').innerHTML = logHtml;
  
  document.getElementById('pdfFooter').textContent = `—— 守城结束，剩余兵力 ${Math.max(0, state.troops)} 人 ——`;

  // 2. 生成图片并下载
  const reportEl = document.getElementById('battleReport');
  html2canvas(reportEl, {
    scale: 2, // 提高清晰度
    backgroundColor: '#f4ebd8'
  }).then(canvas => {
    const imgData = canvas.toDataURL('image/jpeg', 1.0);
    const { jsPDF } = window.jspdf;
    
    // A4 尺寸：210 x 297 mm
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    
    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
    pdf.save(`青石城战报_${state.finalEnding}.pdf`);
    
    btn.textContent = oldText;
    btn.disabled = false;
  }).catch(err => {
    console.error('生成战报失败', err);
    alert('生成战报失败，请重试。');
    btn.textContent = oldText;
    btn.disabled = false;
  });
};
