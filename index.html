<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青石城</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1714;
    color:#d4c9b8;
    font-family:"KaiTi","STKaiti","楷体",serif;
    min-height:100vh;
    overflow-x:hidden;
    transition: background 1.5s ease;
  }
  body.warning { background:#2a1512; }
  body.danger { background:#3a0e0a; }

  #startScreen {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#1a1714; gap:30px;
  }
  #startScreen h1 {
    font-size:48px; letter-spacing:12px;
    color:#c9b99a; font-weight:normal;
  }
  #startScreen p { color:#8a7d6b; font-size:16px; }
  #startBtn {
    margin-top:20px; padding:14px 48px;
    background:transparent; border:1px solid #8a7d6b;
    color:#c9b99a; font-size:20px; font-family:inherit;
    cursor:pointer; letter-spacing:4px; transition:all 0.3s;
  }
  #startBtn:hover { background:#8a7d6b; color:#1a1714; }

  #gameScreen { display:none; max-width:820px; margin:0 auto; padding:40px 20px 120px; }

  #heart {
    position:fixed; left:30px; bottom:30px;
    width:80px; height:80px; z-index:50;
    transform-origin:center;
    transition: filter 0.4s;
  }
  #heart.calm { filter:none; }
  #heart.excited { filter: hue-rotate(-20deg) saturate(1.6) brightness(1.1); }

  @keyframes pulseSmall {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes pulseBig {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  #dialogue { font-size:18px; line-height:2; margin-bottom:40px; }
  #dialogue p { margin-bottom:18px; }
  .speaker { color:#e8d5a8; }
  .speaker.clickable {
    cursor:pointer;
    border-bottom:1px dashed rgba(232,213,168,0.4);
    transition:color 0.2s, border-color 0.2s;
  }
  .speaker.clickable:hover {
    color:#f0e0b8;
    border-bottom-color:#e8d5a8;
  }
  .narration { color:#a89880; font-style:italic; }
  .thought { color:#c9a87a; }

  #choices { display:none; flex-direction:column; gap:14px; }
  .choice-btn {
    background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:16px 20px;
    font-family:inherit; font-size:16px; text-align:left;
    cursor:pointer; line-height:1.6; transition:all 0.2s;
  }
  .choice-btn:hover { border-color:#8a7d6b; background:#24201a; }

  #betPanel {
    display:none; border:1px solid #6a5a42;
    padding:20px; margin-top:10px; background:#1f1a14;
  }
  #betPanel .bet-title { color:#e8d5a8; margin-bottom:14px; font-size:16px; }
  #betPanel .bet-good { color:#7a9e7a; margin-bottom:8px; line-height:1.6; }
  #betPanel .bet-bad { color:#b85c4a; margin-bottom:16px; line-height:1.6; }
  #betPanel .bet-actions { display:flex; gap:12px; }
  .bet-action-btn {
    background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:10px 24px;
    font-family:inherit; font-size:15px; cursor:pointer; transition:all 0.2s;
  }
  .bet-action-btn:hover { border-color:#8a7d6b; }
  .bet-action-btn.primary { border-color:#b85c4a; color:#e8b0a0; }
  .bet-action-btn.primary:hover { background:#b85c4a; color:#1a1714; }
  .bet-action-btn.locked { opacity:0.5; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease; }

  #warningMsg {
    display:none;
    color:#e04838;
    font-size:18px;
    margin-top:14px;
    letter-spacing:2px;
    font-weight:bold;
    text-shadow: 0 0 12px rgba(224,72,56,0.6);
  }

  #result { display:none; margin-top:30px; font-size:17px; line-height:2; }
  #result p { margin-bottom:14px; }

  #notebookBtn, #statsBtn {
    position:fixed; right:20px;
    background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:10px 18px;
    font-family:inherit; font-size:14px; cursor:pointer; z-index:60;
  }
  #notebookBtn { bottom:20px; }
  #statsBtn { bottom:70px; }
  #notebookBtn:hover, #statsBtn:hover { border-color:#8a7d6b; }

  #notebook {
    display:none; position:fixed; right:20px; bottom:70px;
    width:300px; max-height:400px; overflow-y:auto;
    background:#1f1a14; border:1px solid #4a3f32;
    padding:18px; z-index:60; font-size:14px; line-height:1.8;
  }
  #notebook h3 { color:#e8d5a8; font-size:16px; margin-bottom:12px; }
  #notebook table { width:100%; border-collapse:collapse; }
  #notebook td { padding:4px 0; border-bottom:1px dotted #332b22; }
  #notebook td:first-child { color:#8a7d6b; width:40%; }
  .notebook-empty { color:#5a4f42; font-style:italic; }

  .float-text {
    position:fixed; background:rgba(60,20,15,0.85);
    border:1px solid #8a3a2a; color:#e8c0a0;
    padding:8px 14px; font-size:14px; cursor:pointer;
    z-index:70; opacity:0; transition:opacity 0.8s;
    line-height:1.6; max-width:220px;
  }
  .float-text.show { opacity:0.75; }
  .float-text:hover { opacity:1; border-color:#b85c4a; }
  .float-text .full { display:none; margin-top:6px; color:#f0d8c0; font-size:13px; }
  .float-text.expanded .full { display:block; }

  .record-btn {
    display:inline-block; margin-left:8px;
    padding:2px 10px; border:1px solid #4a3f32;
    background:transparent; color:#8a7d6b;
    font-family:inherit; font-size:12px;
    cursor:pointer; vertical-align:middle;
  }
  .record-btn:hover { border-color:#8a7d6b; color:#d4c9b8; }
  .record-btn.done { opacity:0.4; pointer-events:none; }

  #redVignette {
    position:fixed; inset:0; pointer-events:none;
    z-index:40; opacity:0; transition:opacity 2s ease;
    box-shadow: inset 0 0 120px 40px rgba(140,20,10,0.55);
  }

  #tutorialTip {
    position:fixed; bottom:120px; right:20px;
    background:#2a2218; border:1px solid #6a5a42;
    padding:20px 24px; font-size:16px;
    color:#c9b99a; max-width:280px;
    line-height:1.8; z-index:80; display:none;
  }

  #scrollHint {
    text-align:center;
    color:#5a4f42;
    font-size:15px;
    margin-top:40px;
    padding-bottom:50px;
    display:none;
    letter-spacing:4px;
  }

  #audioStatus {
    position:fixed; left:50%; top:16px; transform:translateX(-50%);
    font-size:13px; color:#8a7d6b; z-index:90;
    background:rgba(26,23,20,0.9); padding:6px 14px;
    border:1px solid #4a3f32; display:none;
  }

  #npcOverlay, #statsOverlay {
    position:fixed; inset:0; z-index:150;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center; justify-content:center;
    backdrop-filter: blur(2px);
  }
  #npcPanel, #statsPanel {
    background:#1f1a14;
    border:1px solid #6a5a42;
    padding:28px 32px;
    max-width:420px; width:90%;
    line-height:1.8;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    position:relative;
  }
  #npcPanel h3 {
    color:#e8d5a8; font-size:24px;
    margin-bottom:6px; letter-spacing:4px;
    font-weight:normal;
  }
  #npcPanel .npc-title {
    color:#8a7d6b; font-size:13px;
    margin-bottom:16px; letter-spacing:2px;
  }
  #npcPanel .npc-desc {
    color:#a89880; font-size:15px;
    margin-bottom:22px; font-style:italic;
    line-height:1.9;
    padding-bottom:18px;
    border-bottom:1px dotted #332b22;
  }
  #npcPanel .stat-row {
    display:flex; align-items:center;
    margin-bottom:10px;
  }
  #npcPanel .stat-name {
    width:60px; color:#8a7d6b; font-size:14px;
    letter-spacing:1px;
  }
  #npcPanel .stat-bar {
    flex:1; height:8px; background:#2a2218;
    margin:0 12px; position:relative;
    overflow:hidden;
  }
  #npcPanel .stat-fill {
    height:100%; transition:width 0.3s ease;
  }
  #npcPanel .stat-val {
    width:30px; font-size:14px;
    text-align:right; font-weight:bold;
  }
  .close-btn {
    position:absolute;
    top:14px; right:18px;
    background:transparent; border:none;
    color:#8a7d6b; font-size:22px;
    cursor:pointer; font-family:inherit;
    padding:0 6px;
  }
  .close-btn:hover { color:#e8d5a8; }
  #npcPanel .hint {
    color:#5a4f42; font-size:12px;
    margin-top:18px; text-align:center;
    letter-spacing:2px;
  }

  #statsPanel {
    text-align:center;
    padding:36px 32px 30px;
  }
  #statsPanel h3 {
    color:#e8d5a8; font-size:22px;
    margin-bottom:6px; letter-spacing:6px;
    font-weight:normal;
  }
  #statsPanel .stats-title-sub {
    color:#6a5a42; font-size:12px;
    margin-bottom:26px; letter-spacing:3px;
  }
  #statsPanel .stats-desc {
    color:#d4c9b8; font-size:18px;
    line-height:2; padding:22px 4px;
    border-top:1px dotted #332b22;
    border-bottom:1px dotted #332b22;
    margin-bottom:20px;
  }
  #statsPanel .stats-foot {
    color:#5a4f42; font-size:12px;
    letter-spacing:2px; font-style:italic;
  }
</style>
</head>
<body>

<div id="redVignette"></div>
<div id="audioStatus"></div>

<div id="startScreen">
  <h1>青石城</h1>
  <p>你守的不是一座城，是一万个家。</p>
  <button id="startBtn">开始游戏</button>
</div>

<div id="gameScreen">
  <div id="dialogue"></div>
  <div id="scrollHint">↓ 继续往下看 ↓</div>
  <div id="choices"></div>
  <div id="betPanel"></div>
  <div id="result"></div>
</div>

<img id="heart" class="calm" src="https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png" alt="">

<button id="statsBtn">我的属性</button>
<button id="notebookBtn">军帐笔记</button>
<div id="notebook">
  <h3>军帐笔记</h3>
  <table id="notebookTable"></table>
  <p class="notebook-empty" id="notebookEmpty">尚无记录。</p>
</div>

<div id="tutorialTip">点击【记下】把数字记入笔记。<br>不记也不会死，但记混了别怪军师。</div>

<div id="npcOverlay">
  <div id="npcPanel">
    <button class="close-btn" id="npcClose">×</button>
    <h3 id="npcName"></h3>
    <div class="npc-title" id="npcTitle"></div>
    <div class="npc-desc" id="npcDesc"></div>
    <div id="npcStats"></div>
    <div class="hint">点击名字可随时查看</div>
  </div>
</div>

<div id="statsOverlay">
  <div id="statsPanel">
    <button class="close-btn" id="statsClose">×</button>
    <h3>在军民眼中</h3>
    <div class="stats-title-sub">— 此乃他人眼中之你 —</div>
    <div class="stats-desc" id="statsDesc"></div>
    <div class="stats-foot">你的名声，会影响别人怎么算计你。</div>
  </div>
</div>

<audio id="bgm" loop preload="auto">
  <source src="https://videotourl.com/audio/1793641287845-340cdecb-ab47-41b7-8c76-e3c94fff6423.mp3" type="audio/mpeg">
</audio>
<audio id="heartbeatSfx" preload="auto">
  <source src="https://videotourl.com/audio/1793642652773-6f5ed6a8-121b-4d66-8073-256c842472f9.mp3" type="audio/mpeg">
</audio>

<script>
const tickMarks = [
  0.021,0.811,2.453,2.699,3.787,4.320,5.920,6.731,7.019,7.829,
  8.107,8.629,9.419,17.205,18.027,19.648,19.915,21.515,22.325,
  24.203,25.835,26.635,28.235,28.512,30.123,34.432,35.221,36.875,
  37.120,38.720,39.520,41.408,43.040,43.829,45.440,45.728,47.328,
  51.616,52.427,54.048,54.315,55.915,56.725,58.603,60.213,61.024,
  62.645,62.923,64.512,68.832,69.621,71.232,71.520,73.131,73.920,
  75.797,77.493,78.219,79.840,80.117,81.707,86.027,86.816,88.427,
  88.693,89.771,90.325,91.925,92.736,92.992,93.824,94.112,94.624,
  95.413,97.024,97.301,98.400,98.912,100.523,103.232,104.021,105.664,
  105.920,107.520,108.320,110.197,111.829,112.619,114.272,114.517,
  116.117,120.437,121.227,122.837,123.125,124.757,125.525,127.403,
  129.045,129.824,131.435,131.712,133.333,137.632,138.421,140.043,
  140.309,141.387,141.920,143.531,144.341,144.619,145.419,145.717,
  146.219,147.051,148.661,148.907,150.005,150.528,152.139,152.939,
  153.227,154.027,154.315,154.837,155.627,157.237,157.515,158.592,
  159.125,160.736,161.547,161.824,162.624,162.923,163.445,164.256,
  165.867,166.112,167.189,167.755
];

const npcData = {
  '周先生': {
    title: 'A军军师 · 姓周',
    desc: '六十多岁，头发花白，走路拄拐。跟随老主将三十年，见过三场大战。说话慢，爱说"未必"。看起来什么都懂，但什么都不打包票。',
    stats: { 智谋: 9, 胆识: 4, 统率: 7, 经验: 10, 忠诚: 9 }
  },
  '赵将军': {
    title: 'A军年轻将领 · 姓赵',
    desc: '三十出头，甲叶锃亮，嗓门大。老主将的外甥，从小在军营长大，没打过硬仗。想立功，急。周先生说往东，他偏想往西试试。',
    stats: { 智谋: 3, 胆识: 9, 统率: 5, 经验: 3, 忠诚: 8 }
  },
  '老陈': {
    title: 'A军斥候 · 猎户出身',
    desc: '四十多岁，话少，眼睛毒。在青石城打了二十年猎，西边的树林他闭着眼都能走。他说"鸟惊了三次"，那就真是三次。但为什么惊，他说不准。',
    stats: { 智谋: 5, 胆识: 6, 统率: 2, 经验: 9, 忠诚: 8 }
  },
  '副将李': {
    title: 'A军副将 · 姓李',
    desc: '四十岁，话不多，甲胄总是整整齐齐。跟了你十年，从伍长一路升到副将。你让他往东，他不问为什么。但偶尔事后会说一句"当时我觉得……"',
    stats: { 智谋: 5, 胆识: 6, 统率: 8, 经验: 7, 忠诚: 10 }
  },
  '韩主将': {
    title: 'B军主将 · 姓韩',
    desc: '四十岁，多谋。少年时在边关打过十年仗，从死人堆里爬出来的。粮少，急，但急而不乱。他手下的兵服他，但也怕他。',
    stats: { 智谋: 9, 胆识: 7, 统率: 9, 经验: 9, 忠诚: 6 }
  },
  '马副将': {
    title: 'B军副将 · 姓马',
    desc: '三十多岁，贪功。看不起A军，总觉得韩主将太小心。韩主将说什么他点头，转过头就跟部下嘀咕"换了我早打下来了"。',
    stats: { 智谋: 4, 胆识: 8, 统率: 5, 经验: 4, 忠诚: 5 }
  },
};

function getStatColor(v) {
  if (v >= 8) return { color:'#d4a85a', fill:'#b8902a' };
  if (v >= 5) return { color:'#a89880', fill:'#6a5a42' };
  return { color:'#8a5a4a', fill:'#5a3a2a' };
}

const npcOverlay = document.getElementById('npcOverlay');
const npcName = document.getElementById('npcName');
const npcTitle = document.getElementById('npcTitle');
const npcDesc = document.getElementById('npcDesc');
const npcStats = document.getElementById('npcStats');

function showNpcPanel(name) {
  const npc = npcData[name];
  if (!npc) return;
  npcName.textContent = name;
  npcTitle.textContent = npc.title;
  npcDesc.textContent = npc.desc;
  npcStats.innerHTML = Object.entries(npc.stats).map(([stat, val]) => {
    const c = getStatColor(val);
    return `<div class="stat-row">
      <div class="stat-name">${stat}</div>
      <div class="stat-bar"><div class="stat-fill" style="width:${val*10}%; background:${c.fill};"></div></div>
      <div class="stat-val" style="color:${c.color};">${val}</div>
    </div>`;
  }).join('');
  npcOverlay.style.display = 'flex';
}

document.getElementById('npcClose').onclick = () => {
  npcOverlay.style.display = 'none';
};
npcOverlay.onclick = (e) => {
  if (e.target === npcOverlay) npcOverlay.style.display = 'none';
};

const state = {
  started: false,
  heartExcited: false,
  forcedBet: false,
  rethought: false,
  morale: 0,
  troops: 12000,
  food: 40,
  water: true,
  gateSouth: '完好',
  notes: {},
  floatedTexts: [],
  currentRound: 1,
  playerStats: {
    智谋: 5,
    胆识: 5,
    统率: 5,
    威望: 5,
    果断: 5,
  },
};

const bgm = document.getElementById('bgm');
const heartbeatSfx = document.getElementById('heartbeatSfx');
const heart = document.getElementById('heart');
const audioStatus = document.getElementById('audioStatus');

let markIndex = 0;
let lastBgmTime = 0;
let fastHeartbeatInterval = null;

function showAudioStatus(msg) {
  audioStatus.textContent = msg;
  audioStatus.style.display = 'block';
  setTimeout(() => { audioStatus.style.display = 'none'; }, 5000);
}

function startBgm() {
  bgm.volume = 0.4;
  const p = bgm.play();
  if (p && p.catch) {
    p.catch(err => {
      showAudioStatus('背景音乐未能播放：' + err.name + '。请再点一次开始按钮。');
    });
  }
}

function checkTicks() {
  if (!state.started) { requestAnimationFrame(checkTicks); return; }
  if (!bgm.paused) {
    const t = bgm.currentTime;
    if (t < lastBgmTime - 1) markIndex = 0;
    lastBgmTime = t;
    while (markIndex < tickMarks.length && tickMarks[markIndex] <= t) {
      onTick();
      markIndex++;
    }
  }
  requestAnimationFrame(checkTicks);
}

function onTick() {
  if (!state.heartExcited) pulseHeart();
}

function pulseHeart() {
  const anim = state.heartExcited ? 'pulseBig' : 'pulseSmall';
  heart.style.animation = 'none';
  void heart.offsetHeight;
  heart.style.animation = anim + ' 0.2s ease-out';
}

function playHeartbeatSfx() {
  try {
    heartbeatSfx.currentTime = 0;
    heartbeatSfx.volume = 0.6;
    heartbeatSfx.play().catch(() => {});
  } catch (e) {}
}

function setHeartExcited(excited) {
  state.heartExcited = excited;
  if (excited) {
    heart.classList.remove('calm');
    heart.classList.add('excited');
    heart.src = 'https://cdn.phototourl.com/member/2026-11-02-782fd5c5-d6e4-4606-89a4-db5b7451ba16.png';
    if (fastHeartbeatInterval) clearInterval(fastHeartbeatInterval);
    fastHeartbeatInterval = setInterval(() => {
      pulseHeart();
      playHeartbeatSfx();
    }, 280);
  } else {
    heart.classList.remove('excited');
    heart.classList.add('calm');
    heart.src = 'https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png';
    if (fastHeartbeatInterval) {
      clearInterval(fastHeartbeatInterval);
      fastHeartbeatInterval = null;
    }
  }
}

const STAT_NAMES = ['智谋','胆识','统率','威望','果断'];

const STRONG_PHRASES = {
  智谋: '军中都说你心思缜密',
  胆识: '军中都说你敢下狠手',
  统率: '你带兵有方',
  威望: '军民都服你',
  果断: '你做事从不拖泥带水',
};

const WEAK_PHRASES = {
  智谋: '但有时想得不深',
  胆识: '但遇大事有时迟疑',
  统率: '但不太体恤士卒死活',
  威望: '但底下人心里不太服',
  果断: '但遇事容易犹豫',
};

function describePlayer(stats) {
  const vals = STAT_NAMES.map(n => stats[n]);
  const minV = Math.min(...vals);
  const maxV = Math.max(...vals);
  const allMid = (maxV - minV <= 1) && maxV <= 6 && minV >= 4;
  if (allMid) return '一个平平无奇的守将，没有特别出彩的地方，也没有明显短板。';
  const maxName = STAT_NAMES[vals.indexOf(maxV)];
  const minName = STAT_NAMES[vals.indexOf(minV)];
  const hasStrong = maxV >= 6;
  const hasWeak = minV <= 4;
  if (hasStrong && hasWeak && maxName !== minName) {
    return STRONG_PHRASES[maxName] + '，' + WEAK_PHRASES[minName] + '。';
  }
  if (hasStrong) return STRONG_PHRASES[maxName] + '。';
  if (hasWeak) return '说不上哪里好，' + WEAK_PHRASES[minName] + '。';
  return '一个平平无奇的守将。';
}

function applyStatChanges(changes) {
  if (!changes) return;
  Object.entries(changes).forEach(([stat, delta]) => {
    if (state.playerStats[stat] !== undefined) {
      state.playerStats[stat] = Math.max(1, Math.min(10, state.playerStats[stat] + delta));
    }
  });
}

function calcWinChance(choice) {
  let chance = choice.winChance !== undefined ? choice.winChance : 0.6;
  if (choice.statBonus) {
    Object.entries(choice.statBonus).forEach(([stat, bonus]) => {
      const diff = (state.playerStats[stat] || 5) - 5;
      chance += diff * bonus;
    });
  }
  if (choice.floatBonus && state.floatedTexts.includes(choice.floatBonus.index)) {
    chance += choice.floatBonus.bonus;
  }
  return Math.max(0.05, Math.min(0.95, chance));
}

function showStatsPanel() {
  statsDesc.textContent = describePlayer(state.playerStats);
  statsOverlay.style.display = 'flex';
  document.getElementById('notebook').style.display = 'none';
  notebookOpen = false;
}

};

};

const dialogueEl = document.getElementById('dialogue');
const choicesEl = document.getElementById('choices');
const betPanelEl = document.getElementById('betPanel');
const resultEl = document.getElementById('result');
const scrollHint = document.getElementById('scrollHint');
const tutorialTip = document.getElementById('tutorialTip');

let currentChoice = null;
let tutorialShown = false;
let activeRevealHandler = null;

function renderDialogue(lines) {
  dialogueEl.innerHTML = '';
  lines.forEach(line => {
    const p = document.createElement('p');
    if (line.type === 'speaker') {
      const clickable = npcData[line.name] ? ' clickable' : '';
      const nameHtml = `<span class="speaker${clickable}" data-npc="${line.name}">${line.name}</span>`;
      p.innerHTML = nameHtml + '：' + line.text;
    } else if (line.type === 'narration') {
      p.className = 'narration';
      p.textContent = line.text;
    } else if (line.type === 'thought') {
      p.className = 'thought';
      p.textContent = line.text;
    }
    dialogueEl.appendChild(p);
  });
}

dialogueEl.addEventListener('click', (e) => {
  const target = e.target.closest('[data-npc]');
  if (target) showNpcPanel(target.dataset.npc);
});

function showChoices(choices) {
  choicesEl.style.display = 'flex';
  choicesEl.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.id + '. ' + c.text;
    btn.onclick = () => onChoiceClick(c);
    choicesEl.appendChild(btn);
  });
}

function revealOnBottom(callback) {
  if (activeRevealHandler) {
    window.removeEventListener('scroll', activeRevealHandler);
    activeRevealHandler = null;
  }
  const reveal = () => {
    if (activeRevealHandler) {
      window.removeEventListener('scroll', activeRevealHandler);
      activeRevealHandler = null;
    }
    scrollHint.style.display = 'none';
    callback();
  };
  const atBottom = () => {
    const scrollBottom = window.scrollY + window.innerHeight;
    const docHeight = document.documentElement.scrollHeight;
    return scrollBottom >= docHeight - 100;
  };
  activeRevealHandler = () => { if (atBottom()) reveal(); };
  setTimeout(() => {
    if (document.documentElement.scrollHeight <= window.innerHeight + 50) { reveal(); return; }
    if (atBottom()) { reveal(); return; }
    scrollHint.style.display = 'block';
    window.addEventListener('scroll', activeRevealHandler);
  }, 200);
}

function showTutorialTip() {
  if (tutorialShown) return;
  tutorialShown = true;
  tutorialTip.style.display = 'block';
  setTimeout(() => { tutorialTip.style.display = 'none'; }, 9000);
}

function onChoiceClick(choice) {
  if (state.forcedBet) return;
  currentChoice = choice;
  choicesEl.style.display = 'none';
  betPanelEl.style.display = 'block';
  const locked = state.rethought;
  betPanelEl.innerHTML =
    '<div class="bet-title">你确定吗？</div>' +
    '<div class="bet-good">如果赌对：' + choice.betGood + '</div>' +
    '<div class="bet-bad">如果赌错：' + choice.betBad + '</div>' +
    '<div class="bet-actions">' +
      '<button class="bet-action-btn primary" id="betConfirm">下注</button>' +
      '<button class="bet-action-btn' + (locked ? ' locked' : '') + '" id="betThink">再想想</button>' +
    '</div>' +
    '<div id="warningMsg">主帅，请做出决定！！！</div>';
  document.getElementById('betConfirm').onclick = () => confirmBet(choice);
  document.getElementById('betThink').onclick = () => {
    if (state.rethought) {
      const warn = document.getElementById('warningMsg');
      warn.style.display = 'block';
      betPanelEl.classList.remove('shake');
      void betPanelEl.offsetHeight;
      betPanelEl.classList.add('shake');
      warn.style.opacity = '0';
      setTimeout(() => { warn.style.transition = 'opacity 0.2s'; warn.style.opacity = '1'; }, 10);
    } else {
      rethink();
    }
  };
}

function rethink() {
  state.rethought = true;
  setHeartExcited(true);
  betPanelEl.style.display = 'none';
  betPanelEl.classList.remove('shake');
  choicesEl.style.display = 'flex';
}

function confirmBet(choice) {
  state.forcedBet = true;
  betPanelEl.style.display = 'none';
  betPanelEl.classList.remove('shake');
  setHeartExcited(false);
  applyStatChanges(choice.statChanges);
  const chance = calcWinChance(choice);
  const win = Math.random() < chance;
  showResult(choice, win);
}

function showResult(choice, win) {
  resultEl.style.display = 'block';
  resultEl.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'narration';
  if (win) {
    p.textContent = choice.resultGood;
    applyEffects(choice.effectsGood);
  } else {
    p.textContent = choice.resultBad;
    applyEffects(choice.effectsBad);
  }
  resultEl.appendChild(p);

  if (choice.death) {
    const p2 = document.createElement('p');
    p2.className = 'thought';
    p2.textContent = '你没有守住青石城。';
    resultEl.appendChild(p2);
    return;
  }

  if (state.morale >= 1) spawnFloatTexts();

  revealOnBottom(() => {
    const contBtn = document.createElement('button');
    contBtn.className = 'bet-action-btn primary';
    contBtn.style.marginTop = '20px';
    contBtn.textContent = '继续';
    contBtn.onclick = () => {
      resultEl.innerHTML = '';
      resultEl.style.display = 'none';
      playRound(state.currentRound + 1);
    };
    resultEl.appendChild(contBtn);
  });
}

function applyEffects(effects) {
  if (!effects) return;
  if (effects.troops) state.troops += effects.troops;
  if (effects.food) state.food += effects.food;
  if (effects.morale) state.morale = Math.min(3, state.morale + effects.morale);
  if (effects.water !== undefined) state.water = effects.water;
  if (effects.gateSouth) state.gateSouth = effects.gateSouth;
  updateRedVignette();
}

function updateRedVignette() {
  const v = document.getElementById('redVignette');
  const body = document.body;
  body.classList.remove('warning', 'danger');
  if (state.morale === 0) v.style.opacity = 0;
  else if (state.morale === 1) { v.style.opacity = 0.3; body.classList.add('warning'); }
  else if (state.morale === 2) { v.style.opacity = 0.6; body.classList.add('danger'); }
  else { v.style.opacity = 0.9; body.classList.add('danger'); }
}

const floatTextPool = [
  { frag: '……使者……马副将……', full: 'B军使者喊话的时候，马副将在后面笑了一下。笑得可得意了。' },
  { frag: '……水坝……表弟……夜里……人……', full: '上游水坝那边，我表弟守夜，说昨天夜里有人影晃，不止一个。' },
  { frag: '……我娘……', full: '援军是不是不来了？我娘还在城里呢。' },
  { frag: '……粮车……太招摇……', full: '那几辆粮车走大路，大摇大摆的，我总觉得不对劲。' },
  { frag: '……韩主将……没吃饭……', full: 'B军韩主将这两天没怎么吃饭，营里传他急得嘴上都起泡了。' },
];

function spawnFloatTexts() {
  const available = floatTextPool
    .map((item, i) => ({ item, i }))
    .filter(x => !state.floatedTexts.includes(x.i));
  if (available.length === 0) return;
  const pick = available[Math.floor(Math.random() * available.length)];
  state.floatedTexts.push(pick.i);
  const data = pick.item;
  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.left = (Math.random() * 55 + 10) + '%';
  el.style.top = (Math.random() * 45 + 20) + '%';
  el.innerHTML = data.frag + '<div class="full">' + data.full + '</div>';
  el.onclick = () => {
    el.classList.toggle('expanded');
    if (el.classList.contains('expanded') && state.morale > 0) {
      state.morale = Math.max(0, state.morale - 1);
      updateRedVignette();
    }
  };
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
}

const notebookTable = document.getElementById('notebookTable');
const notebookEmpty = document.getElementById('notebookEmpty');
let notebookOpen = false;

document.getElementById('notebookBtn').onclick = () => {
  notebookOpen = !notebookOpen;
  document.getElementById('notebook').style.display = notebookOpen ? 'block' : 'none';
  renderNotebook();
  if (notebookOpen) statsOverlay.style.display = 'none';
};

function renderNotebook() {
  const keys = Object.keys(state.notes);
  if (keys.length === 0) {
    notebookTable.innerHTML = '';
    notebookEmpty.style.display = 'block';
    return;
  }
  notebookEmpty.style.display = 'none';
  notebookTable.innerHTML = keys.map(k =>
    '<tr><td>' + k + '</td><td>' + state.notes[k] + '</td></tr>'
  ).join('');
}

function addNote(key, value) {
  state.notes[key] = value;
  renderNotebook();
}

function playRound(roundNum) {
  state.currentRound = roundNum;
  state.forcedBet = false;
  state.rethought = false;
  currentChoice = null;

  if (roundNum === 1) {
    renderDialogue(gameContent.round1.intro);
    const infoP = document.createElement('p');
    infoP.className = 'thought';
    infoP.innerHTML = 'B军一万六，你一万二。B军粮草只够半个月，你够四十天。';
    const btn1 = document.createElement('button');
    btn1.className = 'record-btn';
    btn1.textContent = '记下兵力';
    btn1.onclick = () => {
      addNote('我军兵力', String(state.troops));
      addNote('B军兵力', '16000');
      btn1.textContent = '已记';
      btn1.classList.add('done');
    };
    const btn2 = document.createElement('button');
    btn2.className = 'record-btn';
    btn2.textContent = '记下粮草';
    btn2.onclick = () => {
      addNote('我军粮草', state.food + '日');
      addNote('B军粮草', '约15日');
      btn2.textContent = '已记';
      btn2.classList.add('done');
    };
    infoP.appendChild(btn1);
    infoP.appendChild(btn2);
    dialogueEl.appendChild(infoP);

    revealOnBottom(() => {
      showChoices(gameContent.round1.choices);
      showTutorialTip();
    });
  } else if (roundNum === 2) {
    renderDialogue(gameContent.round2.intro);
    revealOnBottom(() => {
      showChoices(gameContent.round2.choices);
    });
  } else if (roundNum === 3) {
    renderDialogue(gameContent.round3.getIntro());
    revealOnBottom(() => {
      showChoices(gameContent.round3.choices);
    });
  } else if (roundNum === 4) {
    renderDialogue([
      { type: 'narration', text: 'B军退了几里。但韩主将还在。他还有一万多人，粮草只够几天。他一定会再来。' },
      { type: 'narration', text: '（第四轮博弈待续——先试玩前三轮机制）' },
    ]);
    scrollHint.style.display = 'none';
  }
}

document.getElementById('startBtn').onclick = () => {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  state.started = true;
  startBgm();
  requestAnimationFrame(checkTicks);
  playRound(1);
};
</script>
</body>
</html>
