<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青石城</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1714;
    color:#d4c9b8;
    font-family:"KaiTi","STKaiti","楷体",serif;
    min-height:100vh;
    overflow-x:hidden;
    transition: background 1.5s ease;
  }
  body.warning { background:#2a1512; }
  body.danger { background:#3a0e0a; }

  /* 开始界面 */
  #startScreen {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#1a1714;
    gap:30px;
  }
  #startScreen h1 {
    font-size:48px; letter-spacing:12px;
    color:#c9b99a; font-weight:normal;
  }
  #startScreen p { color:#8a7d6b; font-size:16px; }
  #startBtn {
    margin-top:20px; padding:14px 48px;
    background:transparent; border:1px solid #8a7d6b;
    color:#c9b99a; font-size:20px; font-family:inherit;
    cursor:pointer; letter-spacing:4px;
    transition:all 0.3s;
  }
  #startBtn:hover { background:#8a7d6b; color:#1a1714; }

  /* 游戏主界面 */
  #gameScreen {
    display:none;
    max-width:820px; margin:0 auto;
    padding:40px 20px 120px;
  }

  /* 心脏 */
  #heart {
    position:fixed;
    left:30px; bottom:30px;
    width:80px; height:80px;
    z-index:50;
    transition: filter 0.4s;
    transform-origin:center;
  }
  #heart.calm { filter:none; }
  #heart.excited { filter: hue-rotate(-20deg) saturate(1.6) brightness(1.1); }

  /* 对话区 */
  #dialogue {
    font-size:18px; line-height:2;
    margin-bottom:40px;
  }
  #dialogue p { margin-bottom:18px; }
  .speaker { color:#e8d5a8; }
  .narration { color:#a89880; font-style:italic; }
  .thought { color:#c9a87a; }

  /* 选项区 */
  #choices { display:none; flex-direction:column; gap:14px; }
  .choice-btn {
    background:transparent;
    border:1px solid #4a3f32;
    color:#d4c9b8;
    padding:16px 20px;
    font-family:inherit;
    font-size:16px;
    text-align:left;
    cursor:pointer;
    line-height:1.6;
    transition:all 0.2s;
  }
  .choice-btn:hover { border-color:#8a7d6b; background:#24201a; }

  /* 赌局提示面板 */
  #betPanel {
    display:none;
    border:1px solid #6a5a42;
    padding:20px;
    margin-top:10px;
    background:#1f1a14;
  }
  #betPanel .bet-title { color:#e8d5a8; margin-bottom:14px; font-size:16px; }
  #betPanel .bet-good { color:#7a9e7a; margin-bottom:8px; line-height:1.6; }
  #betPanel .bet-bad { color:#b85c4a; margin-bottom:16px; line-height:1.6; }
  #betPanel .bet-actions { display:flex; gap:12px; }
  .bet-action-btn {
    background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:10px 24px;
    font-family:inherit; font-size:15px; cursor:pointer;
    transition:all 0.2s;
  }
  .bet-action-btn:hover { border-color:#8a7d6b; }
  .bet-action-btn.primary { border-color:#b85c4a; color:#e8b0a0; }
  .bet-action-btn.primary:hover { background:#b85c4a; color:#1a1714; }

  /* 结果区 */
  #result { display:none; margin-top:30px; font-size:17px; line-height:2; }
  #result p { margin-bottom:14px; }

  /* 笔记按钮和面板 */
  #notebookBtn {
    position:fixed; right:20px; bottom:20px;
    background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:10px 18px;
    font-family:inherit; font-size:14px; cursor:pointer;
    z-index:60;
  }
  #notebookBtn:hover { border-color:#8a7d6b; }
  #notebook {
    display:none;
    position:fixed; right:20px; bottom:70px;
    width:300px; max-height:400px; overflow-y:auto;
    background:#1f1a14; border:1px solid #4a3f32;
    padding:18px; z-index:60;
    font-size:14px; line-height:1.8;
  }
  #notebook h3 { color:#e8d5a8; font-size:16px; margin-bottom:12px; }
  #notebook table { width:100%; border-collapse:collapse; }
  #notebook td { padding:4px 0; border-bottom:1px dotted #332b22; }
  #notebook td:first-child { color:#8a7d6b; width:40%; }
  .notebook-empty { color:#5a4f42; font-style:italic; }

  /* 飘字 */
  .float-text {
    position:fixed;
    background:rgba(60,20,15,0.85);
    border:1px solid #8a3a2a;
    color:#e8c0a0;
    padding:8px 14px;
    font-size:14px;
    cursor:pointer;
    z-index:70;
    opacity:0;
    transition:opacity 0.8s, transform 0.8s;
    line-height:1.6;
    max-width:220px;
  }
  .float-text.show { opacity:0.75; }
  .float-text:hover { opacity:1; border-color:#b85c4a; }
  .float-text .full { display:none; margin-top:6px; color:#f0d8c0; font-size:13px; }
  .float-text.expanded .full { display:block; }

  /* 记下按钮 */
  .record-btn {
    display:inline-block;
    margin-left:8px;
    padding:2px 10px;
    border:1px solid #4a3f32;
    background:transparent;
    color:#8a7d6b;
    font-family:inherit;
    font-size:12px;
    cursor:pointer;
    vertical-align:middle;
  }
  .record-btn:hover { border-color:#8a7d6b; color:#d4c9b8; }
  .record-btn.done { opacity:0.4; pointer-events:none; }

  /* 红光边缘 */
  #redVignette {
    position:fixed; inset:0; pointer-events:none;
    z-index:40; opacity:0;
    transition:opacity 2s ease;
    box-shadow: inset 0 0 120px 40px rgba(140,20,10,0.55);
  }

  /* 教程提示 */
  #tutorialTip {
    position:fixed;
    bottom:120px; right:20px;
    background:#2a2218; border:1px solid #6a5a42;
    padding:14px 18px; font-size:13px;
    color:#c9b99a; max-width:240px;
    line-height:1.7; z-index:80;
    display:none;
  }
  #tutorialTip::after {
    content:''; position:absolute;
    bottom:-8px; right:30px;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:8px solid #6a5a42;
  }
</style>
</head>
<body>

<div id="redVignette"></div>

<!-- 开始界面 -->
<div id="startScreen">
  <h1>青石城</h1>
  <p>你守的不是一座城，是一万个家。</p>
  <button id="startBtn">开始游戏</button>
</div>

<!-- 游戏界面 -->
<div id="gameScreen">
  <div id="dialogue"></div>
  <div id="choices"></div>
  <div id="betPanel"></div>
  <div id="result"></div>
</div>

<!-- 心脏 -->
<img id="heart" class="calm" src="https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png" alt="">

<!-- 笔记 -->
<button id="notebookBtn">军帐笔记</button>
<div id="notebook">
  <h3>军帐笔记</h3>
  <table id="notebookTable"></table>
  <p class="notebook-empty" id="notebookEmpty">尚无记录。</p>
</div>

<!-- 教程提示 -->
<div id="tutorialTip">点击【记下】把数字记入笔记。<br>不记也不会死，但记混了别怪军师。</div>

<!-- 音频 -->
<audio id="bgm" loop>
  <source src="https://videotourl.com/audio/1793641287845-340cdecb-ab47-41b7-8c76-e3c94fff6423.mp3" type="audio/mpeg">
</audio>
<audio id="heartbeatSfx">
  <source src="https://videotourl.com/audio/1793642652773-6f5ed6a8-121b-4d66-8073-256c842472f9.mp3" type="audio/mpeg">
</audio>

<script>
// ========== 时间戳（音乐里的节奏点，单位：秒）==========
const tickMarks = [
  0.021,0.811,2.453,2.699,3.787,4.320,5.920,6.731,7.019,7.829,
  8.107,8.629,9.419,17.205,18.027,19.648,19.915,21.515,22.325,
  24.203,25.835,26.635,28.235,28.512,30.123,34.432,35.221,36.875,
  37.120,38.720,39.520,41.408,43.040,43.829,45.440,45.728,47.328,
  51.616,52.427,54.048,54.315,55.915,56.725,58.603,60.213,61.024,
  62.645,62.923,64.512,68.832,69.621,71.232,71.520,73.131,73.920,
  75.797,77.493,78.219,79.840,80.117,81.707,86.027,86.816,88.427,
  88.693,89.771,90.325,91.925,92.736,92.992,93.824,94.112,94.624,
  95.413,97.024,97.301,98.400,98.912,100.523,103.232,104.021,105.664,
  105.920,107.520,108.320,110.197,111.829,112.619,114.272,114.517,
  116.117,120.437,121.227,122.837,123.125,124.757,125.525,127.403,
  129.045,129.824,131.435,131.712,133.333,137.632,138.421,140.043,
  140.309,141.387,141.920,143.531,144.341,144.619,145.419,145.717,
  146.219,147.051,148.661,148.907,150.005,150.528,152.139,152.939,
  153.227,154.027,154.315,154.837,155.627,157.237,157.515,158.592,
  159.125,160.736,161.547,161.824,162.624,162.923,163.445,164.256,
  165.867,166.112,167.189,167.755
];

// ========== 状态 ==========
const state = {
  round: 0,
  started: false,
  heartExcited: false,
  decided: false, // 是否已经下注
  rethought: false, // 是否点过"再想想"
  forcedBet: false, // 是否强制下注
  // 军心 0=稳 1=微乱 2=不稳 3=崩
  morale: 0,
  // 数值
  troops: 12000,
  food: 40,
  water: true,
  gateEast: '完好',
  gateSouth: '完好',
  gateNorth: '完好',
  // 笔记
  notes: {},
  // 已触发的飘字索引
  floatedTexts: [],
  // 心跳缩放
  heartScale: 1.0,
};

// ========== 音频 ==========
const bgm = document.getElementById('bgm');
const heartbeatSfx = document.getElementById('heartbeatSfx');
let audioCtx = null;

// 用 Web Audio API 精确获取 currentTime
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 把 audio 元素接入 AudioContext
    const source = audioCtx.createMediaElementSource(bgm);
    source.connect(audioCtx.destination);
  }
  audioCtx.resume();
}

// ========== 节奏检测 ==========
let markIndex = 0;
let lastBgmTime = 0;

function checkTicks() {
  if (!state.started || !bgm || bgm.paused) {
    requestAnimationFrame(checkTicks);
    return;
  }
  const t = bgm.currentTime;
  // 检测循环：如果时间倒退了，说明循环回开头
  if (t < lastBgmTime - 1) {
    markIndex = 0;
  }
  lastBgmTime = t;

  // 找到当前时间之后最近的节奏点
  while (markIndex < tickMarks.length && tickMarks[markIndex] <= t) {
    onTick();
    markIndex++;
  }
  // 如果所有节奏点都过了，等循环
  requestAnimationFrame(checkTicks);
}

function onTick() {
  // 心脏跳动
  pulseHeart();
  // 如果处于激动状态，播放心跳音效
  if (state.heartExcited) {
    playHeartbeatSfx();
  }
}

function pulseHeart() {
  const heart = document.getElementById('heart');
  const scaleMax = state.heartExcited ? 1.18 : 1.06;
  heart.style.transition = 'transform 0.08s ease-out';
  heart.style.transform = `scale(${scaleMax})`;
  setTimeout(() => {
    heart.style.transition = 'transform 0.18s ease-in';
    heart.style.transform = 'scale(1)';
  }, 80);
}

function playHeartbeatSfx() {
  if (!heartbeatSfx) return;
  heartbeatSfx.currentTime = 0;
  heartbeatSfx.volume = 0.6;
  heartbeatSfx.play().catch(() => {});
}

function setHeartExcited(excited) {
  state.heartExcited = excited;
  const heart = document.getElementById('heart');
  if (excited) {
    heart.classList.remove('calm');
    heart.classList.add('excited');
    heart.src = 'https://cdn.phototourl.com/member/2026-11-02-782fd5c5-d6e4-4606-89a4-db5b7451ba16.png';
  } else {
    heart.classList.remove('excited');
    heart.classList.add('calm');
    heart.src = 'https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png';
  }
}

// ========== 游戏内容 ==========
const gameContent = {
  // 开场
  opening: [
    { type: 'narration', text: '青石城，城头。黄昏。' },
    { type: 'narration', text: '你站在城头，看着远处B军的营火。密密麻麻，从西边山脚一直铺到河边。风里有马粪和柴烟的味道。' },
    { type: 'speaker', name: '周先生', text: '主将，B军使者刚才在城下喊话，您听见了？' },
    { type: 'narration', text: '你点头。' },
    { type: 'speaker', name: '周先生', text: '他说三日后攻东门。您信吗？' },
    { type: 'narration', text: '你没回答。' },
    { type: 'speaker', name: '赵将军', text: '主将！B军喊东门，肯定是想骗我们把兵调东门，他好打南门！给我三千人守南门，保证——' },
    { type: 'speaker', name: '周先生', text: '赵将军，B军粮少，急攻是肯定的。但他喊东门，也可能是真打东门。东门墙矮，本来就该多放人。' },
    { type: 'speaker', name: '赵将军', text: '军师，您这话等于没说！' },
    { type: 'speaker', name: '周先生', text: '打仗的事，本来就没有十成十。' },
    { type: 'narration', text: '你看着远处的营火，心里在盘算：' },
    { type: 'thought', text: 'B军一万六，你一万二。B军粮草只够半个月，你够四十天。援军说十天到，已经过了七天，还没影。' },
    { type: 'speaker', name: '老陈', text: '主将，西边树林鸟群惊了，但天太黑，看不清是人还是野兽。' },
    { type: 'speaker', name: '周先生', text: '惊了几次？' },
    { type: 'speaker', name: '老陈', text: '三次。间隔不长。' },
    { type: 'speaker', name: '周先生', text: '主将，鸟惊三次，不像野兽。但也不一定是B军主力，可能是小股试探。' },
    { type: 'speaker', name: '赵将军', text: '管他真假，给我兵，我——' },
    { type: 'speaker', name: '周先生', text: '赵将军，你带兵出城，万一B军主力就在西边，你回得来吗？' },
    { type: 'narration', text: '赵将军噎住了。' },
    { type: 'narration', text: '你手按在城垛上，石头冰凉。' },
    { type: 'thought', text: '现在，你得做决定。' },
  ],
  // 第一轮选项
  round1Choices: [
    {
      id: 'A',
      text: '信赵将军：把七千预备队藏南门后巷，东门只留三千。赌B军声东击西。',
      betGood: 'B军南门撞墙，你反杀。',
      betBad: 'B军真打东门，东门三千对一万六，城破。',
      resultGood: 'B军夜袭南门，先头破门而入，你的预备队从巷子杀出，B先头被堵在城门洞里，死伤两千。B主将退兵，顺手烧了南门外民房，掩护撤退。',
      resultBad: 'B军主力猛攻东门。三千人守不住。城破了。你带着亲兵堵在城门洞里，长枪断了就用刀，刀卷了就用拳头。赵将军在你旁边倒下时还在喊"主将快走"。你没走。',
      death: true,
      effectsGood: { troops: -300, food: -4, gateSouth: '受损' },
      effectsBad: {},
    },
    {
      id: 'B',
      text: '信周先生：东门放六千，南门放四千，留两千机动。不赌，平均分。',
      betGood: 'B军无论打哪个门，你都能顶住。但兵力分散，打不疼B军。',
      betBad: 'B军集中兵力猛攻一门，你可能被消耗得很惨。',
      resultGood: 'B军夜袭东门。东门六千人顶住了。B军退兵，你损失不大，但也没伤到B军筋骨。',
      resultBad: 'B军集中主力猛攻东门。东门六千人顶得很苦，你从南门调机动队支援，勉强守住。但伤亡很大。',
      death: false,
      effectsGood: { troops: -800, food: -4 },
      effectsBad: { troops: -2000, food: -5, morale: 1 },
    },
    {
      id: 'C',
      text: '信老陈：派两千人出城，去西边树林摸一摸，看看鸟为什么惊。',
      betGood: '如果真是B军小股，你抓几个舌头，问出情报。',
      betBad: '如果是B军主力，两千人可能回不来。如果是空的，白折腾，士气下降。',
      resultGood: '两千人摸到西边树林，抓了三个B军斥候。审出B军主力在南边，东门喊话是假的。',
      resultBad: '两千人走进树林，再也没回来。B军主力确实在西边。你少了2000人，还什么也没换到。',
      death: false,
      effectsGood: { troops: -200, food: -3 },
      effectsBad: { troops: -2000, morale: 1, food: -3 },
    },
  ],
};

// ========== 渲染 ==========
const dialogueEl = document.getElementById('dialogue');
const choicesEl = document.getElementById('choices');
const betPanelEl = document.getElementById('betPanel');
const resultEl = document.getElementById('result');

function renderDialogue(lines) {
  dialogueEl.innerHTML = '';
  lines.forEach(line => {
    const p = document.createElement('p');
    if (line.type === 'speaker') {
      p.innerHTML = `<span class="speaker">${line.name}：</span>${line.text}`;
    } else if (line.type === 'narration') {
      p.className = 'narration';
      p.textContent = line.text;
    } else if (line.type === 'thought') {
      p.className = 'thought';
      p.textContent = line.text;
    }
    dialogueEl.appendChild(p);
  });
}

function showChoices(choices) {
  choicesEl.style.display = 'flex';
  choicesEl.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${c.id}. ${c.text}`;
    btn.onclick = () => onChoiceClick(c);
    choicesEl.appendChild(btn);
  });
}

// ========== 选项交互 ==========
let currentChoice = null;

function onChoiceClick(choice) {
  if (state.forcedBet) return; // 已经强制下注了
  currentChoice = choice;
  // 显示赌局面板
  choicesEl.style.display = 'none';
  betPanelEl.style.display = 'block';
  betPanelEl.innerHTML = `
    <div class="bet-title">你确定吗？</div>
    <div class="bet-good">如果赌对：${choice.betGood}</div>
    <div class="bet-bad">如果赌错：${choice.betBad}</div>
    <div class="bet-actions">
      <button class="bet-action-btn primary" id="betConfirm">下注</button>
      <button class="bet-action-btn" id="betThink">再想想</button>
    </div>
  `;
  document.getElementById('betConfirm').onclick = () => confirmBet(choice);
  document.getElementById('betThink').onclick = () => rethink(choice);
}

function rethink(choice) {
  // 点过再想想，触发激动心跳
  state.rethought = true;
  setHeartExcited(true);
  // 返回选项
  betPanelEl.style.display = 'none';
  choicesEl.style.display = 'flex';
}

function confirmBet(choice) {
  state.forcedBet = true;
  betPanelEl.style.display = 'none';
  // 停止激动心跳
  setHeartExcited(false);
  // 计算结果（60%概率赌对）
  const win = Math.random() < 0.6;
  showResult(choice, win);
}

function showResult(choice, win) {
  resultEl.style.display = 'block';
  resultEl.innerHTML = '';
  const p = document.createElement('p');
  if (win) {
    p.className = 'narration';
    p.textContent = choice.resultGood;
    applyEffects(choice.effectsGood);
  } else {
    p.className = 'narration';
    p.textContent = choice.resultBad;
    applyEffects(choice.effectsBad);
    if (choice.death) {
      p.textContent += ' 城破了。';
    }
  }
  resultEl.appendChild(p);

  // 如果没死，显示后续
  if (!choice.death) {
    const p2 = document.createElement('p');
    p2.className = 'thought';
    p2.textContent = win ? '你赌对了。但B军还在。' : '你赌错了。损失不小。';
    resultEl.appendChild(p2);

    const p3 = document.createElement('p');
    p3.className = 'narration';
    p3.textContent = '斥候老陈进来："主将，B军派了一支偏师，大概三千人，往上游去了。"';
    resultEl.appendChild(p3);

    const p4 = document.createElement('p');
    p4.className = 'speaker';
    p4.innerHTML = '周先生：<span>上游有水坝。B军想断水。</span>';
    resultEl.appendChild(p4);

    // 这里先停，等后续扩展
    const p5 = document.createElement('p');
    p5.className = 'thought';
    p5.textContent = '（第二轮博弈待续——先试玩第一轮机制）';
    resultEl.appendChild(p5);
  } else {
    // 死亡结局
    const p2 = document.createElement('p');
    p2.className = 'thought';
    p2.textContent = '你没有守住青石城。';
    resultEl.appendChild(p2);
  }

  // 触发飘字（如果军心不稳）
  if (state.morale >= 1) {
    spawnFloatTexts();
  }
}

// ========== 数值 ==========
function applyEffects(effects) {
  if (!effects) return;
  if (effects.troops) state.troops += effects.troops;
  if (effects.food) state.food += effects.food;
  if (effects.morale) state.morale = Math.min(3, state.morale + effects.morale);
  if (effects.gateSouth) state.gateSouth = effects.gateSouth;
  updateRedVignette();
}

function updateRedVignette() {
  const v = document.getElementById('redVignette');
  const body = document.body;
  if (state.morale === 0) {
    v.style.opacity = 0;
    body.classList.remove('warning', 'danger');
  } else if (state.morale === 1) {
    v.style.opacity = 0.3;
    body.classList.add('warning');
  } else if (state.morale === 2) {
    v.style.opacity = 0.6;
    body.classList.add('danger');
  } else {
    v.style.opacity = 0.9;
    body.classList.add('danger');
  }
}

// ========== 飘字 ==========
const floatTextPool = [
  { frag: '……使者……马副将……', full: 'B军使者喊话的时候，马副将在后面笑了一下。笑得可得意了。' },
  { frag: '……水坝……表弟……夜里……人……', full: '上游水坝那边，我表弟守夜，说昨天夜里有人影晃，不止一个。' },
  { frag: '……我娘……', full: '援军是不是不来了？我娘还在城里呢。' },
  { frag: '……粮车……太招摇……', full: '那几辆粮车走大路，大摇大摆的，我总觉得不对劲。' },
  { frag: '……韩主将……没吃饭……', full: 'B军韩主将这两天没怎么吃饭，营里传他急得嘴上都起泡了。' },
];

function spawnFloatTexts() {
  const available = floatTextPool.filter((_, i) => !state.floatedTexts.includes(i));
  if (available.length === 0) return;
  const idx = Math.floor(Math.random() * available.length);
  const origIdx = floatTextPool.indexOf(available[idx]);
  state.floatedTexts.push(origIdx);
  const data = available[idx];

  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.left = (Math.random() * 60 + 10) + '%';
  el.style.top = (Math.random() * 50 + 20) + '%';
  el.innerHTML = `${data.frag}<div class="full">${data.full}</div>`;
  el.onclick = () => {
    el.classList.toggle('expanded');
    if (el.classList.contains('expanded')) {
      // 点开飘字，军心稍微稳住
      if (state.morale > 0) {
        state.morale = Math.max(0, state.morale - 1);
        updateRedVignette();
      }
    }
  };
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
}

// ========== 笔记 ==========
const notebookTable = document.getElementById('notebookTable');
const notebookEmpty = document.getElementById('notebookEmpty');
let notebookOpen = false;

document.getElementById('notebookBtn').onclick = () => {
  notebookOpen = !notebookOpen;
  document.getElementById('notebook').style.display = notebookOpen ? 'block' : 'none';
  renderNotebook();
};

function renderNotebook() {
  const keys = Object.keys(state.notes);
  if (keys.length === 0) {
    notebookTable.innerHTML = '';
    notebookEmpty.style.display = 'block';
    return;
  }
  notebookEmpty.style.display = 'none';
  notebookTable.innerHTML = keys.map(k =>
    `<tr><td>${k}</td><td>${state.notes[k]}</td></tr>`
  ).join('');
}

function addNote(key, value) {
  state.notes[key] = value;
  renderNotebook();
}

// ========== 记下按钮 ==========
function addRecordBtn(parentP, key, value) {
  const btn = document.createElement('button');
  btn.className = 'record-btn';
  btn.textContent = '记下';
  btn.onclick = () => {
    addNote(key, value);
    btn.textContent = '已记';
    btn.classList.add('done');
  };
  parentP.appendChild(btn);
}

// ========== 开始游戏 ==========
document.getElementById('startBtn').onclick = () => {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  state.started = true;

  // 启动音频
  initAudio();
  bgm.volume = 0.4;
  bgm.play().catch(() => {});

  // 开始节奏检测
  requestAnimationFrame(checkTicks);

  // 教程提示
  setTimeout(() => {
    const tip = document.getElementById('tutorialTip');
    tip.style.display = 'block';
    setTimeout(() => { tip.style.display = 'none'; }, 6000);
  }, 2000);

  // 渲染开场
  renderDialogue(gameContent.opening);

  // 几秒后显示选项
  setTimeout(() => {
    showChoices(gameContent.round1Choices);
  }, 4000);

  // 在对话里加记下按钮（兵力、粮草）
  setTimeout(() => {
    const lastP = dialogueEl.lastElementChild;
    const infoP = document.createElement('p');
    infoP.className = 'thought';
    infoP.innerHTML = 'B军一万六，你一万二。B军粮草只够半个月，你够四十天。';
    dialogueEl.appendChild(infoP);
    addRecordBtn(infoP, '我军兵力', '12000');
    addRecordBtn(infoP, '我军粮草', '40日');
  }, 3000);
};
</script>
