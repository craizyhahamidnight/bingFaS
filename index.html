<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青石城 - 军情司</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1714;
    color:#d4c9b8;
    font-family:"KaiTi","STKaiti","楷体",serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* 呼吸的暗红光晕，呼应之前的红色警告 */
  .pulse-bg {
    position: absolute;
    top: 50%; left: 50%;
    width: 50vw; height: 50vw;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(140,20,10,0.15) 0%, transparent 60%);
    animation: breathe 4s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 600px;
    padding: 40px;
  }

  .title {
    font-size: 36px;
    color: #e8d5a8;
    letter-spacing: 8px;
    margin-bottom: 20px;
    font-weight: normal;
  }

  .divider {
    width: 80px;
    height: 1px;
    background: #6a5a42;
    margin: 0 auto 30px auto;
  }

  .status {
    font-size: 20px;
    color: #c9a87a;
    line-height: 2;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }

  /* 打字机效果的光标 */
  .cursor {
    display: inline-block;
    width: 10px;
    height: 20px;
    background-color: #c9a87a;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 5px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .refresh-btn {
    padding: 12px 40px;
    background: transparent;
    border: 1px solid #4a3f32;
    color: #8a7d6b;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .refresh-btn:hover {
    border-color: #b85c4a;
    color: #e8b0a0;
    background: rgba(184, 92, 74, 0.1);
  }

  .footnote {
    margin-top: 50px;
    font-size: 13px;
    color: #5a4f42;
    letter-spacing: 2px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="pulse-bg"></div>

<div class="container">
  <h1 class="title">青石城 · 军情司</h1>
  <div class="divider"></div>
  
  <div class="status">
    前线战报正在加急整理中<span class="cursor"></span><br>
    <span style="font-size: 16px; color: #8a7d6b;">（主将请稍候，切勿乱了阵脚）</span>
  </div>

  <button class="refresh-btn" onclick="window.location.reload()">刷新战报</button>

  <div class="footnote">
    "兵者，诡道也。更新亦是。"
  </div>
</div>

</body>
</html>
