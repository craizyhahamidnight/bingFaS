<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青石城 - 将星录</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1714; color:#d4c9b8; font-family:"KaiTi","STKaiti","楷体",serif;
    min-height:100vh; overflow-x:hidden; transition: background 1.5s ease;
  }
  body.warning { background:#2a1512; }
  body.danger { background:#3a0e0a; }

  /* 顶部按钮 */
  #topControls {
    position:fixed; top:15px; right:20px; z-index:200; display:flex; gap:10px;
  }
  .top-btn {
    background:rgba(31,26,20,0.9); border:1px solid #4a3f32; color:#8a7d6b;
    padding:6px 12px; font-family:inherit; font-size:13px; cursor:pointer; transition:all 0.2s;
  }
  .top-btn:hover { border-color:#8a7d6b; color:#d4c9b8; }

  /* 开始界面 */
  #startScreen {
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#1a1714; gap:15px;
  }
  #startScreen h1 { font-size:48px; letter-spacing:12px; color:#c9b99a; font-weight:normal; margin-bottom:10px; }
  #startScreen p { color:#8a7d6b; font-size:16px; margin-bottom:30px; }
  .mode-btn {
    padding:14px 48px; width: 280px; background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; font-size:18px; font-family:inherit; cursor:pointer; letter-spacing:4px; transition:all 0.3s;
  }
  .mode-btn:hover { border-color:#8a7d6b; background:#24201a; color:#e8d5a8; }
  .mode-btn .sub { display:block; font-size:12px; color:#6a5a42; letter-spacing:2px; margin-top:6px; }

  #gameScreen { display:none; max-width:820px; margin:0 auto; padding:40px 20px 120px; }

  #heart {
    position:fixed; left:30px; bottom:30px; width:80px; height:80px; z-index:50;
    transform-origin:center; transition: filter 0.4s;
  }
  #heart.calm { filter:none; }
  #heart.excited { filter: hue-rotate(-20deg) saturate(1.6) brightness(1.1); }
  @keyframes pulseSmall { 0%{transform:scale(1);} 40%{transform:scale(1.06);} 100%{transform:scale(1);} }
  @keyframes pulseBig { 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

  #dialogue { font-size:18px; line-height:2; margin-bottom:40px; }
  #dialogue p { margin-bottom:18px; }
  .speaker { color:#e8d5a8; }
  .speaker.clickable { cursor:pointer; border-bottom:1px dashed rgba(232,213,168,0.4); transition:color 0.2s; }
  .speaker.clickable:hover { color:#f0e0b8; }
  .narration { color:#a89880; font-style:italic; }
  .thought { color:#c9a87a; }

  #choices { display:none; flex-direction:column; gap:14px; }
  .choice-btn {
    background:transparent; border:1px solid #4a3f32; color:#d4c9b8; padding:16px 20px;
    font-family:inherit; font-size:16px; text-align:left; cursor:pointer; line-height:1.6; transition:all 0.2s;
  }
  .choice-btn:hover { border-color:#8a7d6b; background:#24201a; }

  #betPanel { display:none; border:1px solid #6a5a42; padding:20px; margin-top:10px; background:#1f1a14; }
  #betPanel .bet-title { color:#e8d5a8; margin-bottom:14px; font-size:16px; }
  #betPanel .bet-good { color:#7a9e7a; margin-bottom:8px; line-height:1.6; }
  #betPanel .bet-bad { color:#b85c4a; margin-bottom:16px; line-height:1.6; }
  #betPanel .bet-actions { display:flex; gap:12px; }
  .bet-action-btn {
    background:transparent; border:1px solid #4a3f32; color:#d4c9b8; padding:10px 24px;
    font-family:inherit; font-size:15px; cursor:pointer; transition:all 0.2s;
  }
  .bet-action-btn:hover { border-color:#8a7d6b; }
  .bet-action-btn.primary { border-color:#b85c4a; color:#e8b0a0; }
  .bet-action-btn.primary:hover { background:#b85c4a; color:#1a1714; }
  .bet-action-btn.locked { opacity:0.5; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
  .shake { animation: shake 0.4s ease; }
  #warningMsg { display:none; color:#e04838; font-size:18px; margin-top:14px; letter-spacing:2px; font-weight:bold; }

  #result { display:none; margin-top:30px; font-size:17px; line-height:2; }
  #result p { margin-bottom:14px; }

  #notebookBtn, #statsBtn {
    position:fixed; right:20px; background:transparent; border:1px solid #4a3f32;
    color:#d4c9b8; padding:10px 18px; font-family:inherit; font-size:14px; cursor:pointer; z-index:60;
  }
  #notebookBtn { bottom:20px; }
  #statsBtn { bottom:70px; }
  #notebookBtn:hover, #statsBtn:hover { border-color:#8a7d6b; }

  #guideBtn {
    display: none; position: fixed; left: 30px; bottom: 130px;
    background: rgba(60, 50, 40, 0.8); border: 1px solid #8a7d6b;
    color: #e8d5a8; padding: 8px 16px; font-family: inherit; font-size: 15px; cursor: pointer; z-index: 60; letter-spacing: 2px;
  }
  #guideBtn:hover { background: #4a3f32; }

  #notebook {
    display:none; position:fixed; right:20px; bottom:70px; width:320px; max-height:450px; overflow-y:auto;
    background:#1f1a14; border:1px solid #4a3f32; padding:18px; z-index:60; font-size:14px; line-height:1.8;
  }
  #notebook h3 { color:#e8d5a8; font-size:16px; margin-bottom:8px; }
  #notebook h4 { color:#c9a87a; font-size:14px; margin:12px 0 6px; letter-spacing:2px; }
  #notebook table { width:100%; border-collapse:collapse; margin-bottom:8px; }
  #notebook td { padding:4px 0; border-bottom:1px dotted #332b22; vertical-align:top; }
  #notebook td:first-child { color:#8a7d6b; width:38%; }
  .notebook-empty { color:#5a4f42; font-style:italic; font-size:13px; }
  .rumor-item { padding:6px 0; border-bottom:1px dotted #332b22; color:#c9a87a; font-size:13px; line-height:1.7; }

  #guideOverlay {
    display: none; position: fixed; left: 30px; bottom: 180px; width: 340px; max-height: 60vh; overflow-y: auto;
    background: #2a2218; border: 1px solid #6a5a42; padding: 20px; z-index: 65; font-size: 15px; line-height: 1.8;
  }
  #guideOverlay h3 { color: #e8d5a8; font-size: 18px; margin-bottom: 12px; border-bottom: 1px dotted #4a3f32; padding-bottom: 8px; }
  #guideOverlay .milestone { color: #c9a87a; font-style: italic; margin-bottom: 10px; }
  #guideOverlay .advice { color: #a89880; margin-bottom: 16px; border-left: 2px solid #8a5a4a; padding-left: 10px; }
  #guideOverlay .highlight { color: #e8b0a0; font-weight: bold; }

  .float-text {
    position:fixed; background:rgba(60,20,15,0.92); border:1px solid #8a3a2a; color:#e8c0a0;
    padding:10px 14px; font-size:14px; cursor:pointer; z-index:70; opacity:0; transition:opacity 0.8s; line-height:1.6; max-width:240px;
  }
  .float-text.show { opacity:0.8; }
  .float-text:hover { opacity:1; border-color:#b85c4a; }
  .float-text .full { display:none; margin-top:8px; color:#f0d8c0; font-size:13px; }
  .float-text.expanded .full { display:block; }
  .float-text .record-close-btn {
    display:none; margin-top:10px; padding:4px 12px; background:transparent; border:1px solid #b85c4a;
    color:#e8b0a0; font-family:inherit; font-size:12px; cursor:pointer;
  }
  .float-text.expanded .record-close-btn { display:inline-block; }
  .float-text .record-close-btn:hover { background:#b85c4a; color:#1a1714; }

  .record-btn {
    display:inline-block; margin-left:8px; padding:2px 10px; border:1px solid #4a3f32;
    background:transparent; color:#8a7d6b; font-family:inherit; font-size:12px; cursor:pointer;
  }
  .record-btn:hover { border-color:#8a7d6b; color:#d4c9b8; }
  .record-btn.done { opacity:0.4; pointer-events:none; }

  #redVignette {
    position:fixed; inset:0; pointer-events:none; z-index:40; opacity:0; transition:opacity 2s ease;
    box-shadow: inset 0 0 120px 40px rgba(140,20,10,0.55);
  }

  #tutorialTip {
    position:fixed; bottom:120px; right:20px; background:#2a2218; border:1px solid #6a5a42;
    padding:20px 24px; font-size:16px; color:#c9b99a; max-width:280px; line-height:1.8; z-index:80; display:none;
  }
  #scrollHint { text-align:center; color:#5a4f42; font-size:15px; margin-top:40px; padding-bottom:50px; display:none; letter-spacing:4px; }
  #audioStatus { position:fixed; left:50%; top:16px; transform:translateX(-50%); font-size:13px; color:#8a7d6b; z-index:90; background:rgba(26,23,20,0.9); padding:6px 14px; border:1px solid #4a3f32; display:none; }

  /* 各种覆盖层面板 */
  #npcOverlay, #statsOverlay, #endingOverlay, #interludeOverlay {
    position:fixed; inset:0; z-index:150; background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; backdrop-filter: blur(2px);
  }
  #npcPanel, #statsPanel, #endingPanel, #interludePanel {
    background:#1f1a14; border:1px solid #6a5a42; padding:28px 32px; max-width:500px; width:90%;
    line-height:1.8; box-shadow: 0 0 40px rgba(0,0,0,0.6); position:relative;
  }
  
  /* NPC 面板 */
  #npcPanel h3 { color:#e8d5a8; font-size:24px; margin-bottom:6px; letter-spacing:4px; font-weight:normal; }
  #npcPanel .npc-title { color:#8a7d6b; font-size:13px; margin-bottom:16px; letter-spacing:2px; }
  #npcPanel .npc-desc { color:#a89880; font-size:15px; margin-bottom:22px; font-style:italic; padding-bottom:18px; border-bottom:1px dotted #332b22; }
  #npcPanel .stat-row { display:flex; align-items:center; margin-bottom:10px; }
  #npcPanel .stat-name { width:60px; color:#8a7d6b; font-size:14px; }
  #npcPanel .stat-bar { flex:1; height:8px; background:#2a2218; margin:0 12px; overflow:hidden; }
  #npcPanel .stat-fill { height:100%; transition:width 0.3s ease; }
  #npcPanel .stat-val { width:30px; font-size:14px; text-align:right; font-weight:bold; }
  
  /* 属性面板 */
  #statsPanel { text-align:center; padding:36px 32px 30px; }
  #statsPanel h3 { color:#e8d5a8; font-size:22px; margin-bottom:6px; letter-spacing:6px; }
  #statsPanel .stats-title-sub { color:#6a5a42; font-size:12px; margin-bottom:26px; letter-spacing:3px; }
  #statsPanel .stats-desc { color:#d4c9b8; font-size:18px; line-height:2; padding:22px 4px; border-top:1px dotted #332b22; border-bottom:1px dotted #332b22; margin-bottom:20px; }
  #statsPanel .stats-foot { color:#5a4f42; font-size:12px; letter-spacing:2px; font-style:italic; }
  #statsPanel .stats-exp { color: #c9a87a; margin-bottom: 15px; font-size: 16px; }

  /* 结局面板 */
  #endingPanel { text-align:center; padding:40px 36px 32px; }
  #endingPanel h2 { color:#e8d5a8; font-size:32px; margin-bottom:8px; letter-spacing:10px; font-weight:normal; }
  #endingPanel .ending-sub { color:#6a5a42; font-size:13px; margin-bottom:28px; letter-spacing:4px; }
  #endingPanel .ending-text { color:#d4c9b8; font-size:17px; line-height:2.1; text-align:left; margin-bottom:26px; padding:20px 0; border-top:1px dotted #332b22; border-bottom:1px dotted #332b22; }
  #endingPanel .ending-stats { color:#a89880; font-size:14px; line-height:1.9; text-align:left; margin-bottom:24px; }
  #endingPanel .ending-stats span { color:#c9a87a; }
  .end-btns { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
  .end-btns button { 
    background:transparent; border:1px solid #8a7d6b; color:#c9b99a; padding:12px 20px;
    font-family:inherit; font-size:15px; letter-spacing:2px; cursor:pointer; transition:all 0.3s;
  }
  .end-btns button:hover { background:#8a7d6b; color:#1a1714; }
  .end-btns button.pdf-btn { border-color: #b85c4a; color: #e8b0a0; }
  .end-btns button.pdf-btn:hover { background: #b85c4a; color: #1a1714; }

  /* 幕间界面 */
  #interludePanel { text-align:center; max-width: 600px; }
  #interludePanel h2 { color:#e8d5a8; font-size:28px; margin-bottom:10px; letter-spacing:6px; }
  #interludePanel .int-desc { color:#a89880; font-size:16px; margin-bottom:20px; line-height:1.8; }
  .campaign-list { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
  .campaign-btn {
    background:#24201a; border:1px solid #6a5a42; color:#e8d5a8; padding:15px;
    font-family:inherit; font-size:18px; cursor:pointer; transition:all 0.2s; text-align:left;
  }
  .campaign-btn:hover:not(:disabled) { background:#332b22; border-color:#b85c4a; }
  .campaign-btn:disabled { opacity:0.3; cursor:not-allowed; border-style:dashed; }
  .campaign-btn small { display:block; color:#8a7d6b; font-size:13px; margin-top:5px; }

  /* 隐藏的战报DOM */
  #battleReport {
    position: fixed; left: -9999px; top: 0; width: 800px; background: #f4ebd8; color: #2b1e16; padding: 50px; font-family: "KaiTi", serif;
  }
  #battleReport h1 { text-align: center; font-size: 36px; letter-spacing: 10px; border-bottom: 2px solid #2b1e16; padding-bottom: 20px; margin-bottom: 30px; }
  #battleReport .report-meta { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 30px; }
  #battleReport .report-log { font-size: 16px; line-height: 1.8; margin-bottom: 30px; padding-left: 20px; }
  #battleReport .report-log li { margin-bottom: 15px; border-bottom: 1px dashed #a89880; padding-bottom: 10px; }
  #battleReport .report-ending { font-size: 20px; text-align: center; border-top: 2px solid #2b1e16; padding-top: 30px; margin-top: 30px; font-weight: bold; }
</style>
</head>
<body>

<div id="redVignette"></div>
<div id="audioStatus"></div>

<div id="topControls">
  <button class="top-btn" id="saveBtn">保存进度</button>
  <button class="top-btn" id="loadBtn">读取进度</button>
</div>

<div id="startScreen">
  <h1>青石城</h1>
  <p>你守的不是一座城，是一万个家。</p>
  <button class="mode-btn" id="startNewBtn">全新开始<span class="sub">历史的车轮在此刻转动</span></button>
  <button class="mode-btn" id="startResumeBtn" style="display:none;">读取存档<span class="sub">继续你未竟的霸业</span></button>
</div>

<div id="gameScreen">
  <div id="dialogue"></div>
  <div id="scrollHint">↓ 继续往下看 ↓</div>
  <div id="choices"></div>
  <div id="betPanel"></div>
  <div id="result"></div>
</div>

<img id="heart" class="calm" src="https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png" alt="">

<div id="guideOverlay">
  <h3 id="guideTitle">兵法</h3>
  <div id="guideContent"></div>
</div>

<button id="guideBtn">兵法</button>
<button id="statsBtn">我的属性</button>
<button id="notebookBtn">军帐笔记</button>

<div id="notebook">
  <h3>军帐笔记</h3>
  <h4>军情</h4>
  <table id="notebookTable"></table>
  <p class="notebook-empty" id="notebookEmpty">尚无记录。</p>
  <h4>奇闻</h4>
  <div id="rumorList"><p class="notebook-empty">尚无奇闻。</p></div>
</div>

<div id="tutorialTip">点击【记下】把数字记入笔记。<br>不记也不会死，但记混了别怪军师。</div>

<!-- NPC -->
<div id="npcOverlay">
  <div id="npcPanel">
    <button class="close-btn" id="npcClose">×</button>
    <h3 id="npcName"></h3>
    <div class="npc-title" id="npcTitle"></div>
    <div class="npc-desc" id="npcDesc"></div>
    <div id="npcStats"></div>
    <div class="hint">点击名字可随时查看</div>
  </div>
</div>

<!-- 属性 -->
<div id="statsOverlay">
  <div id="statsPanel">
    <button class="close-btn" id="statsClose">×</button>
    <h3>在军民眼中</h3>
    <div class="stats-title-sub">— 此乃他人眼中之你 —</div>
    <div class="stats-desc" id="statsDesc"></div>
    <div class="stats-exp" id="statsExp">经验：0　心气：0</div>
    <div class="stats-foot">你的名声，会影响别人怎么算计你。</div>
  </div>
</div>

<!-- 幕间 -->
<div id="interludeOverlay">
  <div id="interludePanel">
    <h2>战后休整</h2>
    <div class="stats-exp" id="intExp" style="margin-bottom:20px;">经验：0　心气：0</div>
    <p class="int-desc">B军退去，青石城迎来了短暂的安宁。<br>你凭借此战积攒了威望，但天下大势未定。<br>请选择接下来的行动：</p>
    <div class="campaign-list">
      <button class="campaign-btn" id="btn-chase">追击战：穷寇莫追<small>痛打落水狗，但小心困兽犹斗。</small></button>
      <button class="campaign-btn" id="btn-food">夺粮战：断其命脉<small>深入敌后，烧毁敌军粮草。</small></button>
      <button class="campaign-btn" id="btn-court">朝堂战：后院起火<small>面对钦差，你该如何保住兵权？</small></button>
    </div>
    <div id="allCompleteMsg" style="display:none; color:#d4a85a; margin-top:20px; font-size:18px;">
      所有战役已通关！青石城威震天下！
    </div>
  </div>
</div>

<!-- 结局 -->
<div id="endingOverlay">
  <div id="endingPanel">
    <h2 id="endingTitle"></h2>
    <div class="ending-sub" id="endingSub"></div>
    <div class="ending-text" id="endingText"></div>
    <div class="ending-stats" id="endingStats"></div>
    <div class="end-btns">
      <button class="pdf-btn" id="downloadPdfBtn">导出战报</button>
      <button class="restart-btn" id="endingContinueBtn" onclick="location.reload()">再守一次</button>
    </div>
  </div>
</div>

<div id="battleReport">
  <h1>青石城战报</h1>
  <div class="report-meta">
    <div>主将评价：<span id="pdfEval"></span></div>
    <div>当前阶段：<span id="pdfEnding"></span></div>
  </div>
  <ul class="report-log" id="pdfLog"></ul>
  <div class="report-ending" id="pdfFooter"></div>
</div>

<audio id="bgm" loop preload="auto">
  <source src="https://videotourl.com/audio/1793641287845-340cdecb-ab47-41b7-8c76-e3c94fff6423.mp3" type="audio/mpeg">
</audio>
<audio id="heartbeatSfx" preload="auto">

let markIndex = 0;
let lastBgmTime = 0;
let fastHeartbeatInterval = null;

function startBgm() {
  bgm.volume = 0.4;
  bgm.play().catch(() => {});
}

function checkTicks() {
  if (!bgm.paused) {
    const t = bgm.currentTime;
    if (t < lastBgmTime - 1) markIndex = 0;
    lastBgmTime = t;
    while (markIndex < tickMarks.length && tickMarks[markIndex] <= t) {
      if (!state.heartExcited) pulseHeart();
      markIndex++;
    }
  }
  requestAnimationFrame(checkTicks);
}

function pulseHeart() {
  const anim = state.heartExcited ? 'pulseBig' : 'pulseSmall';
  heart.style.animation = 'none';
  void heart.offsetHeight;
  heart.style.animation = anim + ' 0.2s ease-out';
}

function playHeartbeatSfx() {
  try {
    heartbeatSfx.currentTime = 0;
    heartbeatSfx.volume = 0.6;
    heartbeatSfx.play().catch(() => {});
  } catch (e) {}
}

function setHeartExcited(excited) {
  state.heartExcited = excited;
  if (excited) {
    heart.classList.remove('calm');
    heart.classList.add('excited');
    heart.src = 'https://cdn.phototourl.com/member/2026-11-02-782fd5c5-d6e4-4606-89a4-db5b7451ba16.png';
    if (fastHeartbeatInterval) clearInterval(fastHeartbeatInterval);
    fastHeartbeatInterval = setInterval(() => {
      pulseHeart();
      playHeartbeatSfx();
    }, 280);
  } else {
    heart.classList.remove('excited');
    heart.classList.add('calm');
    heart.src = 'https://cdn.phototourl.com/member/2026-11-02-36a5566b-457c-4986-b715-dc7cb965661d.png';
    if (fastHeartbeatInterval) { clearInterval(fastHeartbeatInterval); fastHeartbeatInterval = null; }
  }
}

function renderDialogue(lines) {
  dialogueEl.innerHTML = '';

function showChoices(choices) {

    btn.textContent = c.id + '. ' + c.text;
    btn.onclick = () => onChoiceClick(c);
    choicesEl.appendChild(btn);
  });
}

function revealOnBottom(callback) {
  if (activeRevealHandler) {
    window.removeEventListener('scroll', activeRevealHandler);
    activeRevealHandler = null;
  }
  const reveal = () => {
    if (activeRevealHandler) {
      window.removeEventListener('scroll', activeRevealHandler);
      activeRevealHandler = null;
    }
    scrollHint.style.display = 'none';
    callback();
  };
  const atBottom = () => window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 100;
  activeRevealHandler = () => { if (atBottom()) reveal(); };
  setTimeout(() => {
    if (document.documentElement.scrollHeight <= window.innerHeight + 50) { reveal(); return; }
    if (atBottom()) { reveal(); return; }
    scrollHint.style.display = 'block';
    window.addEventListener('scroll', activeRevealHandler);
  }, 200);
}

// ========== 赌局与结算 ==========
function onChoiceClick(choice) {
  if (state.forcedBet) return;
  choicesEl.style.display = 'none';
  betPanelEl.style.display = 'block';
  const locked = state.rethought;
  betPanelEl.innerHTML =
    '<div class="bet-title">你确定吗？</div>' +
    `<div class="bet-good">如果赌对：${choice.betGood}</div>` +
    `<div class="bet-bad">如果赌错：${choice.betBad}</div>` +
    '<div class="bet-actions">' +
      '<button class="bet-action-btn primary" id="betConfirm">下注</button>' +
      `<button class="bet-action-btn${locked?' locked':''}" id="betThink">再想想</button>` +
    '</div>' +
    '<div id="warningMsg">主帅，请做出决定！！！</div>';
  document.getElementById('betConfirm').onclick = () => confirmBet(choice);
  document.getElementById('betThink').onclick = () => {
    if (state.rethought) {
      const warn = document.getElementById('warningMsg');
      warn.style.display = 'block';
      betPanelEl.classList.remove('shake');
      void betPanelEl.offsetHeight;
      betPanelEl.classList.add('shake');
    } else {
      state.rethought = true;
      setHeartExcited(true);
      betPanelEl.style.display = 'none';
      choicesEl.style.display = 'flex';
    }
  };
}

function applyStatChanges(changes) {
  if (!changes) return;
  Object.entries(changes).forEach(([stat, delta]) => {
    if (state.playerStats[stat] !== undefined) {
      state.playerStats[stat] = Math.max(1, Math.min(10, state.playerStats[stat] + delta));
    }
  });
}

function calcWinChance(choice) {
  let chance = choice.winChance !== undefined ? choice.winChance : 0.6;
  if (choice.statBonus) {
    Object.entries(choice.statBonus).forEach(([stat, bonus]) => {
      const diff = (state.playerStats[stat] || 5) - 5;
      chance += diff * bonus;
    });
  }
  const stage = getStage();
  if (choice.floatBonus && stage.floatedTexts.includes(choice.floatBonus.index)) {
    chance += choice.floatBonus.bonus;
  }
  // 附加心气和经验加成
  chance += (state.will * 0.02) + (state.exp * 0.01);
  return Math.max(0.05, Math.min(0.95, chance));
}

function confirmBet(choice) {
  state.forcedBet = true;
  betPanelEl.style.display = 'none';
  setHeartExcited(false);
  applyStatChanges(choice.statChanges);
  const win = Math.random() < calcWinChance(choice);
  showResult(choice, win);
}

function applyEffects(effects) {
  if (!effects) return;
  const stage = getStage();
  if (effects.troops) stage.troops += effects.troops;
  if (effects.food) stage.food += effects.food;
  if (effects.morale) stage.morale = Math.min(3, stage.morale + effects.morale);
  if (effects.civilMorale) stage.civilMorale = Math.min(3, stage.civilMorale + effects.civilMorale);
  if (effects.water !== undefined) stage.water = effects.water;
  if (effects.gateSouth) stage.gateSouth = effects.gateSouth;
  if (effects.gateNorth) stage.gateNorth = effects.gateNorth;
  if (effects.gateEast) stage.gateEast = effects.gateEast;
  updateRedVignette();
  renderNotebook();
}

function showResult(choice, win) {
  const stage = getStage();
  resultEl.style.display = 'block';
  resultEl.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'narration';
  if (win) {
    p.textContent = choice.resultGood;
    applyEffects(choice.effectsGood);
  } else {
    p.textContent = choice.resultBad;
    applyEffects(choice.effectsBad);
    worsenCivilMorale();
  }
  resultEl.appendChild(p);

  stage.history.push({
    round: stage.currentRound,
    choice: choice.text,
    win: win,
    troops: stage.troops,
    food: stage.food,
    morale: stage.morale,
    civilMorale: stage.civilMorale
  });

  if (choice.death && !win) {
    const p2 = document.createElement('p');
    p2.className = 'thought';
    p2.textContent = '你失败了。';
    resultEl.appendChild(p2);
    setTimeout(() => triggerEnding('大败'), 1200);
    return;
  }

  if (stage.morale >= 1 || stage.civilMorale >= 1) spawnFloatTexts();

  revealOnBottom(() => {
    const contBtn = document.createElement('button');
    contBtn.className = 'bet-action-btn primary';
    contBtn.style.marginTop = '20px';
    if (stage.currentRound >= 3) { // 3轮制
      contBtn.textContent = '看结局';
      contBtn.onclick = () => { triggerEnding(); };
    } else {
      contBtn.textContent = '继续';
      contBtn.onclick = () => {
        resultEl.innerHTML = '';
        resultEl.style.display = 'none';
        playRound(stage.currentRound + 1);
      };
    }
    resultEl.appendChild(contBtn);
  });
}

function worsenCivilMorale() {
  const stage = getStage();
  stage.civilMorale = Math.min(3, stage.civilMorale + 1);
  if (stage.civilMorale === 2 && stage.morale < 1) stage.morale = 1;
  if (stage.civilMorale === 3 && stage.morale < 2) stage.morale = 2;
  updateRedVignette();
  renderNotebook();
}

function updateRedVignette() {
  const stage = getStage();
  const v = document.getElementById('redVignette');
  const body = document.body;
  body.classList.remove('warning', 'danger');
  if (stage.morale === 0) v.style.opacity = 0;
  else if (stage.morale === 1) { v.style.opacity = 0.3; body.classList.add('warning'); }
  else if (stage.morale === 2) { v.style.opacity = 0.6; body.classList.add('danger'); }
  else { v.style.opacity = 0.9; body.classList.add('danger'); }
}

// ========== 辅助功能 ==========
function describePlayer() {
  const stats = state.playerStats;
  const vals = Object.values(stats);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  if (maxV - minV <= 1 && maxV <= 6 && minV >= 4) return '一个平平无奇的守将，没有特别出彩的地方，也没有明显短板。';
  const maxName = Object.keys(stats).find(k => stats[k] === maxV);
  const minName = Object.keys(stats).find(k => stats[k] === minV);
  const strong = { 智谋:'心思缜密', 胆识:'敢下狠手', 统率:'带兵有方', 威望:'军民都服', 果断:'从不拖泥带水' };
  const weak = { 智谋:'想得不深', 胆识:'有时迟疑', 统率:'不体恤士卒', 威望:'底下人不服', 果断:'容易犹豫' };
  if (maxV >= 6 && minV <= 4) return `军中都说你${strong[maxName]}，但${weak[minName]}。`;
  if (maxV >= 6) return `军中都说你${strong[maxName]}。`;
  if (minV <= 4) return `说不上哪里好，但${weak[minName]}。`;
  return '一个平平无奇的守将。';
}

function spawnFloatTexts() {
  const pool = [
    { frag:'……使者……马副将……', full:'B军使者喊话的时候，马副将在后面笑了一下。' },
    { frag:'……水坝……夜里……人……', full:'上游水坝那边，守夜的看到有人影晃。' },
    { frag:'……我娘……', full:'援军是不是不来了？我娘还在城里呢。' },
    { frag:'……粮车……太招摇……', full:'那几辆粮车走大路，太招摇了。' },
  ];
  const stage = getStage();
  const available = pool.map((item, i) => ({ item, i })).filter(x => !stage.floatedTexts.includes(x.i));
  if (available.length === 0) return;
  const pick = available[Math.floor(Math.random() * available.length)];
  stage.floatedTexts.push(pick.i);
  
  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.left = (Math.random() * 55 + 10) + '%';
  el.style.top = (Math.random() * 45 + 20) + '%';
  el.innerHTML = pick.item.frag + '<div class="full">' + pick.item.full + '<button class="record-close-btn">记录并关闭</button></div>';
  el.onclick = (e) => {
    if (e.target.classList.contains('record-close-btn')) {
      stage.rumors.push(pick.item.full);
      renderNotebook();
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
      return;
    }
    el.classList.toggle('expanded');
  };
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
}

function renderNotebook() {
  const stage = getStage();
  const keys = Object.keys(stage.notes);
  const table = document.getElementById('notebookTable');
  if (keys.length === 0) {
    table.innerHTML = '';
    document.getElementById('notebookEmpty').style.display = 'block';
  } else {
    document.getElementById('notebookEmpty').style.display = 'none';
    table.innerHTML = keys.map(k => `<tr><td>${k}</td><td>${stage.notes[k]}</td></tr>`).join('');
  }
  const rumorList = document.getElementById('rumorList');
  if (stage.rumors.length === 0) {
    rumorList.innerHTML = '<p class="notebook-empty">尚无奇闻。</p>';
  } else {
    rumorList.innerHTML = stage.rumors.map(r => `<div class="rumor-item">${r}</div>`).join('');
  }
}

document.getElementById('notebookBtn').onclick = () => {
  const panel = document.getElementById('notebook');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  renderNotebook();
};

// ========== 核心流程控制 ==========
function playRound(roundNum) {
  const stage = getStage();
  stage.currentRound = roundNum;
  state.forcedBet = false;
  state.rethought = false;

  let data;
  if (state.phase === 'act1') data = act1Content[roundNum];
  else data = campaignContent[state.currentCampaign][roundNum];

  renderDialogue(data.intro);
  revealOnBottom(() => { showChoices(data.choices); });
}

function triggerEnding(forced = '') {
  let ending;
  if (forced === '大败') {
    ending = '失败';
  } else {
    const stage = getStage();
    if (stage.troops < 3000 || stage.morale >= 3) ending = '失败';
    else if (stage.troops < 6000 || stage.morale >= 2) ending = '惨胜';
    else if (stage.troops < 9000) ending = '胜利';
    else ending = '大胜';
  }

  // 计算奖励
  let expGain = 0, willGain = 0;
  if (ending === '大胜') { expGain = 3; willGain = 4; }
  else if (ending === '胜利') { expGain = 2; willGain = 3; }
  else if (ending === '惨胜') { expGain = 4; willGain = 1; }
  else { expGain = 1; willGain = -2; }

  state.exp = Math.max(0, state.exp + expGain);
  state.will = Math.max(0, state.will + willGain);

  const titles = { '失败':'败 北', '惨胜':'惨 胜', '胜利':'胜 利', '大胜':'大 胜' };
  const texts = {
    '失败': '你败了。在滚滚的历史长河中，成王败寇是不变的真理。你只能带着残兵败将退回城中，舔舐伤口，等待下一次机会。',
    '惨胜': '你赢了，但代价太大了。地上全是尸体，活着的人也已经精神崩溃。你用无数人的命，换来了一场虚无缥缈的胜利。',
    '胜利': '你击退了敌军，保住了阵地。虽然有损失，但建制还在，军心依然可用。',
    '大胜': '一场毫无悬念的碾压。你的战术和勇猛摧毁了敌人的意志。B军溃不成军，你的威名将传唱四方。'
  };

  document.getElementById('endingTitle').textContent = titles[ending];
  document.getElementById('endingSub').textContent = `获得经验 ${expGain}，心气 ${willGain > 0 ? '+'+willGain : willGain}`;
  document.getElementById('endingText').textContent = texts[ending];
  document.getElementById('endingStats').innerHTML = `剩余兵力：<span>${Math.max(0, getStage().troops)}</span>　评价：<span>${describePlayer()}</span>`;

  const btn = document.getElementById('endingContinueBtn');
  const stage = getStage();

  if (state.phase === 'act1') {
    btn.textContent = '进入战后休整';
    btn.onclick = () => {
      document.getElementById('endingOverlay').style.display = 'none';
      state.phase = 'interlude';
      openInterlude();
    };
  } else {
    // 战役结束
    if (ending === '失败') {
      btn.textContent = '重新作战';
      btn.onclick = () => {
        document.getElementById('endingOverlay').style.display = 'none';
        // 重置战役状态
        state.camp = initStage();
        state.camp.troops = 10000; // 战役基础兵力
        state.camp.food = 30;
        playRound(1);
      };
    } else {
      // 胜利，不能刷数据，标记完成
      state.completedCampaigns.push(state.currentCampaign);
      btn.textContent = '返回大营';
      btn.onclick = () => {
        document.getElementById('endingOverlay').style.display = 'none';
        state.phase = 'interlude';
        openInterlude();
      };
    }
  }

  document.getElementById('endingOverlay').style.display = 'flex';
}

function openInterlude() {
  document.getElementById('interludeOverlay').style.display = 'flex';
  document.getElementById('intExp').textContent = `经验：${state.exp}　心气：${state.will}`;
  
  const setBtn = (id, key) => {
    const btn = document.getElementById(id);
    if (state.completedCampaigns.includes(key)) {
      btn.disabled = true;
      btn.innerHTML = `已通关<small>此战役已平定。</small>`;
    } else {
      btn.disabled = false;
      const name = campaignContent[key].name;
      const desc = {
        chase: '痛打落水狗，但小心困兽犹斗。',
        food: '深入敌后，烧毁敌军粮草。',
        court: '面对钦差，你该如何保住兵权？'
      }[key];
      btn.innerHTML = `${name}<small>${desc}</small>`;
    }
  };

  setBtn('btn-chase', 'chase');
  setBtn('btn-food', 'food');
  setBtn('btn-court', 'court');

  if (state.completedCampaigns.length === 3) {
    document.getElementById('allCompleteMsg').style.display = 'block';
  }
}

function startCampaign(key) {
  document.getElementById('interludeOverlay').style.display = 'none';
  state.phase = 'campaign';
  state.currentCampaign = key;
  state.camp = initStage();
  state.camp.troops = 10000;
  state.camp.food = 30;
  
  playRound(1);
}

// ========== 存档机制 ==========
document.getElementById('saveBtn').onclick = () => {
  localStorage.setItem('qingshi_save', JSON.stringify(state));
  alert('进度已保存到本地！');
};

document.getElementById('loadBtn').onclick = () => {
  const saved = localStorage.getItem('qingshi_save');
  if (saved) {
    state = JSON.parse(saved);
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    
    if (state.phase === 'interlude') {
      openInterlude();
    } else {
      // 如果在战役或第一幕中途，回到当前轮的选项界面
      playRound(getStage().currentRound);
    }
  } else {
    alert('没有找到存档！');
  }
};

// ========== 启动逻辑 ==========
document.getElementById('startNewBtn').onclick = () => {
  state.phase = 'act1';
  state.act1 = initStage();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('guideBtn').style.display = 'block';
  startBgm();
  requestAnimationFrame(checkTicks);
  playRound(1);
};

document.getElementById('startResumeBtn').onclick = () => {
  document.getElementById('loadBtn').click();
};

document.getElementById('btn-chase').onclick = () => startCampaign('chase');
document.getElementById('btn-food').onclick = () => startCampaign('food');
document.getElementById('btn-court').onclick = () => startCampaign('court');

document.getElementById('npcClose').onclick = () => document.getElementById('npcOverlay').style.display = 'none';
document.getElementById('statsClose').onclick = () => document.getElementById('statsOverlay').style.display = 'none';
document.getElementById('notebookBtn').onclick = () => {
  const p = document.getElementById('notebook');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  renderNotebook();
};

// PDF 导出（略作调整）
document.getElementById('downloadPdfBtn').onclick = () => {
  document.getElementById('pdfEval').textContent = describePlayer();
  document.getElementById('pdfEnding').textContent = getStage().history.length > 0 ? (getStage().history[getStage().history.length-1].win ? '胜利' : '交战') : '无';
  document.getElementById('pdfLog').innerHTML = getStage().history.map(h => `<li>第${h.round}轮：${h.choice}<br>【${h.win?'胜':'败'}】 (兵力: ${Math.max(0, h.troops)})</li>`).join('');
  document.getElementById('pdfFooter').textContent = `剩余兵力 ${Math.max(0, getStage().troops)} 人`;
  
  const report = document.getElementById('battleReport');
  html2canvas(report, { scale: 2 }).then(canvas => {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 210, (canvas.height * 210) / canvas.width);
    pdf.save(`青石城战报_${state.currentCampaign || '守城战'}.pdf`);
  });
};

// 初始化提示
if (localStorage.getItem('qingshi_save')) {
  document.getElementById('startResumeBtn').style.display = 'block';
}
</script>
</body>
</html>
